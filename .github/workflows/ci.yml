name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv-ci PY=.venv/bin/python
      - run: make spec-check PY=.venv/bin/python

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: make venv-ci PY=.venv/bin/python
      - run: make docs-check PY=.venv/bin/python

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make lean-check PY=python3

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo test -p rgen-core -p rgen-keystore -p rgen-sdk -p rgen-cli
      - run: cargo check -p rgen-wasm --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web audit --omit=dev
      - run: npm --prefix web run wasm:build
      - run: npm --prefix web run test:wasm
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build

  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      # Install the pinned toolchain before the build. The hosted image can carry a
      # partial 1.95.0 toolchain whose real files conflict with rustup's component
      # symlinks ("detected conflict: bin/cargo-fmt"); remove it, then install the
      # minimal profile, which is all the parse build needs. The parse step sets
      # RUSTUP_TOOLCHAIN so rustup does not re-read rust-toolchain.toml and try to add
      # rustfmt and clippy, which is what hit the conflict.
      - name: Install Rust
        run: |
          rm -rf "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-x86_64-unknown-linux-gnu"
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rchain-models builds its protos with prost-build, which needs protoc on PATH.
      # Fetch it from the GitHub release instead of apt: the Ubuntu mirror intermittently
      # fails to resolve on hosted runners and takes the whole parse job with it.
      - uses: arduino/setup-protoc@v3
        with:
          version: "21.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make venv-ci PY=.venv/bin/python
      - run: make build PY=.venv/bin/python
      - run: RCHAIN_RUST_DIR=$PWD/rnode-rust RUSTUP_TOOLCHAIN=1.95.0 tools/parse_check.sh contracts/build/deploy/*.rho

  devnet:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv-ci PY=.venv/bin/python
      - run: cargo build -p rgen-cli
      - run: DEVNET_PREFIX=rgen DEVNET_NODE_MEMORY=8g RHOLO_DIR=$PWD/rnode-rust \
          make devnet-up keys install devnet-verify unit-all demo-seed demo-verify \
            demo-azoth demo-azoth-verify \
            redteam redteam-capabilities probe-deploy-semantics PY=.venv/bin/python
        env:
          RGEN_EXPECT: fixed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@wasm-pack
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          RGEN_E2E: "1"
          RGEN_E2E_JOURNEY: "1"
