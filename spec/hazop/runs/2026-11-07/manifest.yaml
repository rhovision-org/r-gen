schema: rgen.hazop-run/v1
run_id: 2026-11-07
date: 2026-11-07
baseline: 639d0f2b2ddcb4cc2f90186b4b7ad82b296fc008
worktree: contract and Lean fixes under review
method: >-
  Blind multi-agent HAZOP. Each analyst received only its node scope, the contract
  source, the 15 guide words, and the row schema. The existing worksheet, findings
  ledger, flow manifests and other analysts' rows were withheld until adjudication.
  Red-team probes were run against the live devnet install and recorded separately.
agreement_rule: >-
  Every new S1 or S2 row has at least two independent authors, or an adjudication
  decision with a reproduced counterexample. S3/S4 rows may be single-author.
agents:
  - id: analyst-identity-credentials
    scope: [identity, issuer-credential-proof, registries-factories]
    blind_inputs:
      - contracts/src/deploy/00_root.rho
      - contracts/src/deploy/10_identity.rho
      - contracts/src/deploy/11_credentials.rho
      - contracts/src/lib/Auth.rho
      - contracts/src/lib/Scope.rho
      - contracts/src/lib/Proof.rho
  - id: analyst-claim-kasset-oracle
    scope: [claim-validation, kasset-nesting, oracle]
    blind_inputs:
      - contracts/src/deploy/20_claim.rho
      - contracts/src/lib/KAsset.rho
      - contracts/src/deploy/30_oracle.rho
      - contracts/src/lib/Proof.rho
  - id: analyst-vp-provenance-workflow
    scope:
      - value-proposition
      - provenance
      - deploy-root
      - wf-onboard
      - wf-propose-claim
      - wf-validate-mint
      - wf-dispute-decide-execute
      - wf-closeout-provenance
      - wf-recovery
      - xnode-authority
      - xnode-registry
      - xnode-time
    blind_inputs:
      - contracts/src/deploy/22_value.rho
      - contracts/src/deploy/40_provenance.rho
      - contracts/src/deploy/00_root.rho
      - harness/install.py
  - id: redteam-operator
    scope: [live-devnet exploits]
    blind_inputs:
      - harness/probe_deploy_semantics.py
      - harness/redteam_core.py
adjudicator: owner
