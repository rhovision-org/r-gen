schema: rgen.hazop-run/v1
run_id: 2026-11-07-capabilities
date: 2026-11-07
baseline: 38d0003
worktree: object-capability audit, pre-fix tree
method: >-
  Blind multi-agent HAZOP. Each analyst received only its node scope, the contract source,
  the guide words and the row schema. The capability register, findings ledger, red-team
  results and other analysts' rows were withheld until adjudication. The red-team operator
  ran harness/redteam_capabilities.py against the local devnet and recorded RT-025..RT-035.
agreement_rule: >-
  Every new S1 or S2 row has at least two independent authors, or an adjudication decision
  with a reproduced counterexample. S3/S4 rows may be single-author.
nodes:
  - cap-designation
  - cap-publication
  - cap-authority
  - cap-delegation
  - cap-confused-deputy
  - cap-attenuation
  - cap-revocation
  - cap-serialization
  - cap-client-manifest
guide_words:
  - No/Not
  - More
  - Less
  - As well as
  - Part of
  - Reverse
  - Other than
  - Late
  - Early
  - Before
  - After
  - Duplicate/Replay
  - Stale
  - Substitute/confused-deputy
  - Partial commit
  - Delegate
  - Amplify
  - Leak
  - Bearer
  - Revoke
  - Attenuate
agents:
  - id: cap-analyst-root-credential
    scope: [cap-designation, cap-publication, cap-authority]
    blind_inputs:
      - contracts/src/deploy/00_root.rho
      - contracts/src/deploy/10_identity.rho
      - contracts/src/deploy/11_credentials.rho
      - contracts/src/lib/Auth.rho
      - contracts/src/lib/Scope.rho
      - contracts/src/lib/Proof.rho
      - harness/install.py
  - id: cap-analyst-claim-kasset
    scope: [cap-delegation, cap-confused-deputy, cap-attenuation]
    blind_inputs:
      - contracts/src/deploy/20_claim.rho
      - contracts/src/lib/KAsset.rho
      - contracts/src/lib/Proof.rho
      - contracts/src/lib/Status.rho
  - id: cap-analyst-vp-oracle-provenance
    scope: [cap-revocation, cap-serialization, cap-client-manifest]
    blind_inputs:
      - contracts/src/deploy/22_value.rho
      - contracts/src/deploy/30_oracle.rho
      - contracts/src/deploy/40_provenance.rho
      - harness/install.py
      - crates/rgen-core/src/manifest.rs
      - crates/rgen-sdk/src/client.rs
      - crates/rgen-sdk/src/wire.rs
      - web/scripts/sync-manifest.mjs
  - id: redteam-operator
    scope: [live-devnet capability probes]
    blind_inputs:
      - harness/redteam_capabilities.py
adjudicator: owner
findings: []
