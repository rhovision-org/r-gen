rows:
- id: HZ-ROOT-001
  node: root-install
  guide_word: No/Not
  parameter: installer
  deviation: Register is invoked without the installer capability.
  cause: Any address can call GenRoot.register; the arm compares the derived authSubject address to the stored installer.
  consequence: If the comparison were removed or misbound, anyone could replace component URIs.
  safeguard: authSubject plus installer equality on every register path.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ROOT-002
  node: root-install
  guide_word: More
  parameter: key
  deviation: More registry keys than the deployment intends.
  cause: There is no key allowlist or cap; rootState accepts every new key.
  consequence: Unbounded root state and ambiguous component discovery.
  safeguard: Duplicate-key refusal only.
  safeguard_status: partial
  severity: S3
  likelihood: B
  risk: 6
  action: RR-10
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-003
  node: root-install
  guide_word: Less
  parameter: key
  deviation: An empty or truncated key is registered.
  cause: There is no non-empty or format check on @key.
  consequence: Lookup and duplicate detection become ambiguous.
  safeguard: Duplicate-key refusal only.
  safeguard_status: partial
  severity: S3
  likelihood: A
  risk: 8
  action: RR-10
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-004
  node: root-install
  guide_word: As well as
  parameter: kind
  deviation: An extra or mislabelled kind is stored with the entry.
  cause: '@kind is stored but not validated against the component catalogue.'
  consequence: A consumer can resolve a bundle of the wrong kind.
  safeguard: Consumer-side URI and shape checks only.
  safeguard_status: none
  severity: S3
  likelihood: B
  risk: 6
  action: RR-10
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-005
  node: root-install
  guide_word: Part of
  parameter: uri
  deviation: A partial or malformed URI is registered.
  cause: There is no URI syntax check at registration.
  consequence: resolve fails after install and the failure is delayed to the consumer.
  safeguard: Placeholder resolution and parse checks at install time.
  safeguard_status: partial
  severity: S3
  likelihood: B
  risk: 6
  action: RR-10
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-006
  node: root-install
  guide_word: Reverse
  parameter: version
  deviation: A new key is registered with a lower version than an earlier component.
  cause: There is no monotonicity rule across keys; duplicate keys are refused only.
  consequence: Consumers cannot use version to order deployments.
  safeguard: Per-entry version > 0 only.
  safeguard_status: partial
  severity: S3
  likelihood: C
  risk: 4
  action: accept-risk
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-007
  node: root-install
  guide_word: Other than
  parameter: key
  deviation: A key from another namespace or component family is substituted.
  cause: Keys are free-form strings with no namespace schema.
  consequence: Lookup returns a different component than the consumer intended.
  safeguard: Installer review of the key list.
  safeguard_status: partial
  severity: S3
  likelihood: B
  risk: 6
  action: RR-10
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-008
  node: root-install
  guide_word: Before
  parameter: term-order
  deviation: A term is deployed before root.
  cause: The harness could be invoked out of order outside the Makefile.
  consequence: Placeholder resolution fails and the install aborts.
  safeguard: install.py ORDER, dry-run, and parse-check.
  safeguard_status: holds
  severity: S3
  likelihood: B
  risk: 6
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ROOT-009
  node: root-install
  guide_word: After
  parameter: term-order
  deviation: The root is installed after its consumers.
  cause: A manual deploy can ignore the dependency order.
  consequence: Factory URIs are unresolved when the consumer is installed.
  safeguard: Dependency order and captured placeholder URIs.
  safeguard_status: holds
  severity: S3
  likelihood: B
  risk: 6
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ROOT-010
  node: root-install
  guide_word: Duplicate/Replay
  parameter: key
  deviation: The same key is registered twice.
  cause: A replayed deploy tries to overwrite an entry.
  consequence: The second registration would change the mapping used by consumers.
  safeguard: Duplicate-key refusal; the old entry is kept.
  safeguard_status: holds
  severity: S3
  likelihood: B
  risk: 6
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ROOT-011
  node: root-install
  guide_word: Stale
  parameter: uri
  deviation: resolve returns a URI that no longer names the intended component.
  cause: A term can be redeployed under a new URI while the old key remains.
  consequence: Consumers continue to call an obsolete component.
  safeguard: Duplicate-key refusal prevents overwrite, but there is no retirement record.
  safeguard_status: partial
  severity: S3
  likelihood: C
  risk: 4
  action: accept-risk
  finding: RGA-029
  negative: false
  disposition: accept-risk
- id: HZ-ROOT-012
  node: root-install
  guide_word: Substitute/confused-deputy
  parameter: installer
  deviation: A caller substitutes another address for the installer.
  cause: The register arm accepts an identity capability, not a caller-nominated string.
  consequence: An unauthorized caller could register a component.
  safeguard: authSubject derives the REV address from the signature.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ROOT-013
  node: root-install
  guide_word: Partial commit
  parameter: key
  deviation: rootState is written but the acknowledgement is lost.
  cause: The caller retries after a deploy or communication failure.
  consequence: A retry could double-register or observe an unclear result.
  safeguard: Linear consume and re-post on every path; duplicate refusal makes retry safe.
  safeguard_status: holds
  severity: S3
  likelihood: B
  risk: 6
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-001
  node: identity
  guide_word: No/Not
  parameter: owner
  deviation: Identity.update is called without the owner capability.
  cause: Any address can call update; the arm compares authSubject to the stored subject.
  consequence: If the comparison were removed, any caller could patch the profile.
  safeguard: authSubject plus subject equality.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-002
  node: identity
  guide_word: More
  parameter: owner
  deviation: The profile update path is assumed to transfer ownership or add owners.
  cause: The model has updateOwner, but the deployed Identity.update only patches profile hashes.
  consequence: A proof about owner transfer is mapped to an arm that never performs it.
  safeguard: None; the mapping is wrong.
  safeguard_status: none
  severity: S3
  likelihood: B
  risk: 6
  action: LR-00
  finding: RGA-013
  negative: false
  disposition: fixed
- id: HZ-ID-003
  node: identity
  guide_word: Less
  parameter: owner
  deviation: The owner field is missing or emptied.
  cause: The deployed identity has a fixed subject and no owner field; the model can set an arbitrary new owner.
  consequence: A model proof can claim a transfer that the contract cannot express.
  safeguard: The subject is fixed at create.
  safeguard_status: none
  severity: S3
  likelihood: B
  risk: 6
  action: LR-08
  finding: RGA-013
  negative: false
  disposition: fixed
- id: HZ-ID-004
  node: identity
  guide_word: As well as
  parameter: patch
  deviation: The patch contains fields outside displayNameHash, orgHash, and contactHash.
  cause: The arm copies only the three known fields; extra fields are ignored.
  consequence: A caller may believe an unsupported field was updated.
  safeguard: Explicit field selection in the update arm.
  safeguard_status: holds
  severity: S4
  likelihood: B
  risk: 3
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-005
  node: identity
  guide_word: Part of
  parameter: patch
  deviation: A partial patch omits one of the three hashes.
  cause: The arm writes the missing field as Nil, erasing the old value.
  consequence: Profile data is silently lost on a partial update.
  safeguard: None; there is no merge or presence check.
  safeguard_status: none
  severity: S3
  likelihood: B
  risk: 6
  action: LR-08
  finding: RGA-013
  negative: false
  disposition: fixed
- id: HZ-ID-006
  node: identity
  guide_word: Reverse
  parameter: patch
  deviation: A profile update is reversed.
  cause: There is no revision history or undo arm.
  consequence: A mistaken update cannot be rolled back; the owner must repatch.
  safeguard: None; this is an append-only version counter, not a history.
  safeguard_status: none
  severity: S4
  likelihood: B
  risk: 3
  action: accept-risk
  finding: RGA-008
  negative: false
  disposition: fixed
- id: HZ-ID-007
  node: identity
  guide_word: Other than
  parameter: address
  deviation: Create is attempted for an address other than the signer.
  cause: authOwner derives the address; the profile cannot nominate another address.
  consequence: An identity could be created for a victim address.
  safeguard: authOwner and first-writer-wins.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-008
  node: identity
  guide_word: Duplicate/Replay
  parameter: entry
  deviation: Create is replayed for an address that already has an identity.
  cause: Two creates race on directoryState.
  consequence: Two identity cells could be published for one address.
  safeguard: First-writer-wins on byAddress; the second create refuses.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-009
  node: identity
  guide_word: Stale
  parameter: entry
  deviation: The directory points at an identity whose URI has changed.
  cause: The update arm does not change the URI; only create writes the directory.
  consequence: A stale directory entry would resolve to a retired identity.
  safeguard: The URI is written once at create.
  safeguard_status: holds
  severity: S3
  likelihood: B
  risk: 6
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-010
  node: identity
  guide_word: Substitute/confused-deputy
  parameter: address
  deviation: A caller substitutes another signer's address in the profile.
  cause: The profile fields are hashes, not addresses; the subject is derived from the signature.
  consequence: A profile could be misattributed to another address.
  safeguard: authOwner derives the subject.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-ID-011
  node: identity
  guide_word: Partial commit
  parameter: entry
  deviation: Create writes identityState, registers the bundle, then writes directoryState.
  cause: The writes are separate cells and there is no recovery record.
  consequence: A failure between writes can leave an orphan identity or a directory entry without a bundle.
  safeguard: None; the model proves first-writer-wins only.
  safeguard_status: none
  severity: S2
  likelihood: B
  risk: 9
  action: RR-11
  finding: RGA-031
  negative: false
  disposition: fixed
- id: HZ-CRED-001
  node: issuer-credential-proof
  guide_word: No/Not
  parameter: issuer
  deviation: Issue is attempted without the issuer capability.
  cause: CredentialFactory.issue calls Issuer.authorize and checks the returned subject.
  consequence: An unauthorized issuer could mint a credential.
  safeguard: Issuer.authorize, subject equality, and the self-issue refusal.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-002
  node: issuer-credential-proof
  guide_word: More
  parameter: issuer
  deviation: More issuers or issuer scopes than intended.
  cause: The issuer is immutable and there is no issuer registry.
  consequence: A compromised issuer key cannot be replaced or revoked.
  safeguard: Issuer immutability; Issuer.revoke was removed from the core.
  safeguard_status: partial
  severity: S2
  likelihood: C
  risk: 6
  action: accept-risk
  finding: RGA-004
  negative: false
  disposition: fixed
- id: HZ-CRED-003
  node: issuer-credential-proof
  guide_word: Less
  parameter: issuer
  deviation: The issuer scope is missing or narrower than the credential requests.
  cause: Issuer.covers checks the issuer list and maxLevel.
  consequence: A credential could be issued outside the issuer's scope.
  safeguard: issuerCovers and scopeMatches.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-004
  node: issuer-credential-proof
  guide_word: As well as
  parameter: subject
  deviation: A credential is issued to a subject other than the proof holder.
  cause: The subject is stored; prove checks the caller against it.
  consequence: A credential could be used by a non-subject.
  safeguard: authSubject plus subject equality in prove.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-005
  node: issuer-credential-proof
  guide_word: Part of
  parameter: scope
  deviation: A scope field is wildcarded or partially matched.
  cause: scopeMatches treats '*' and 'global' as wildcards and compares numeric levels.
  consequence: A credential could match a requirement broader than intended.
  safeguard: Explicit wildcard rules; model does not prove the string comparison.
  safeguard_status: partial
  severity: S3
  likelihood: B
  risk: 6
  action: LR-01
  finding: RGA-004
  negative: false
  disposition: fixed
- id: HZ-CRED-006
  node: issuer-credential-proof
  guide_word: Reverse
  parameter: status
  deviation: Revoke is followed by prove.
  cause: Revoke sets status revoked; prove checks active status.
  consequence: A revoked credential could still issue proofs.
  safeguard: Status guard in prove; model revoke blocks prove.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-007
  node: issuer-credential-proof
  guide_word: Other than
  parameter: status
  deviation: An unknown status string is stored or supplied.
  cause: The contract compares status to 'active'; anything else is treated as not active.
  consequence: An unknown status fails closed for prove and renew.
  safeguard: Explicit active-status comparison.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-008
  node: issuer-credential-proof
  guide_word: Late
  parameter: expiresAt
  deviation: Prove is attempted after expiry.
  cause: Prove checks height > expiresAt.
  consequence: An expired credential could still prove.
  safeguard: Strict expiry guard.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-009
  node: issuer-credential-proof
  guide_word: Early
  parameter: issuedAt
  deviation: Prove is attempted before issuedAt.
  cause: The deployed prove has no issuedAt lower bound; the model adds one.
  consequence: A credential can be used earlier than the model permits, so the model is stricter here.
  safeguard: Deployed expiry guard only; no deployed issuedAt check.
  safeguard_status: none
  severity: S3
  likelihood: B
  risk: 6
  action: LR-08
  finding: RGA-004
  negative: false
  disposition: fixed
- id: HZ-CRED-010
  node: issuer-credential-proof
  guide_word: Before
  parameter: proof-use
  deviation: A proof is taken before the credential is proven.
  cause: The proof URI is only issued by prove.
  consequence: A caller could fabricate a proof URI.
  safeguard: Registry resolution and private Proof capability.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-011
  node: issuer-credential-proof
  guide_word: After
  parameter: proof-use
  deviation: A proof is taken after the credential is revoked.
  cause: The proof is a snapshot; revoke does not retroactively invalidate it.
  consequence: A relying party could accept a proof issued before revoke.
  safeguard: Documented non-retroactivity; consumers must check status if freshness matters.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-012
  node: issuer-credential-proof
  guide_word: Duplicate/Replay
  parameter: proof-use
  deviation: The same proof is taken twice.
  cause: A replayed take or a copied proof URI.
  consequence: The payload could be used for two authorizations.
  safeguard: One-shot used flag in Proof.take; proof_take_once_versioned.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-013
  node: issuer-credential-proof
  guide_word: Stale
  parameter: proof-use
  deviation: A proof issued at an old height is presented as current.
  cause: The proof payload carries atHeight; consumers compare it to the height they expect.
  consequence: A consumer that trusts the payload's height could accept a stale proof.
  safeguard: checkCredentialProof compares atHeight to the caller-supplied expected height.
  safeguard_status: partial
  severity: S3
  likelihood: B
  risk: 6
  action: LR-01
  finding: RGA-004
  negative: false
  disposition: fixed
- id: HZ-CRED-014
  node: issuer-credential-proof
  guide_word: Substitute/confused-deputy
  parameter: subject
  deviation: A proof for one credential URI is presented for another.
  cause: checkCredentialProof compares credentialUri and subject.
  consequence: A proof could authorize the wrong credential.
  safeguard: URI and subject binding in the proof check.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CRED-015
  node: issuer-credential-proof
  guide_word: Partial commit
  parameter: proof-use
  deviation: Prove consumes credState, creates proofState, and re-posts the credential.
  cause: The proof cell and the credential state are separate writes.
  consequence: A failure can leave an unreachable proof or a consumed credential.
  safeguard: Proof.take one-shot; no recovery record for the prove window.
  safeguard_status: partial
  severity: S2
  likelihood: B
  risk: 9
  action: RR-11
  finding: RGA-002
  negative: false
  disposition: fixed
- id: HZ-CLAIM-001
  node: claim-validation
  guide_word: No/Not
  parameter: validator
  deviation: Validate is called without a credential proof.
  cause: Claim.validate resolves the credential and calls proveAndCheck.
  consequence: An unqualified validator could validate a claim.
  safeguard: CredentialFactory.verify plus proveAndCheck.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-002
  node: claim-validation
  guide_word: More
  parameter: validator
  deviation: A claim is validated more than once.
  cause: Two validate calls race on claimState.
  consequence: Two K-Assets or two competing verdicts could be recorded.
  safeguard: Status guard and linear consume; model validate_once.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-003
  node: claim-validation
  guide_word: Less
  parameter: validator
  deviation: The validator's credential scope is insufficient for the claim.
  cause: proveAndCheck uses the claim's selectionCriteria.
  consequence: An under-qualified validator could validate.
  safeguard: scopeMatches and issuerCovers through the credential proof.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-004
  node: claim-validation
  guide_word: As well as
  parameter: verdict
  deviation: The validation record contains extra fields or an unexpected verdict shape.
  cause: finalizeValidation reads verdict, quality, and credentialUri; it does not schema-check the record.
  consequence: An unexpected record can reach the status mappings.
  safeguard: None beyond the credential proof.
  safeguard_status: none
  severity: S2
  likelihood: B
  risk: 9
  action: RR-04
  finding: RGA-020
  negative: false
  disposition: fixed
- id: HZ-CLAIM-005
  node: claim-validation
  guide_word: Part of
  parameter: verdict
  deviation: The validation record omits verdict or quality.
  cause: The contract reads missing fields as Nil.
  consequence: claimStatus treats Nil as validated; kassetStatus treats Nil as rejected.
  safeguard: None; the two mappings disagree.
  safeguard_status: none
  severity: S2
  likelihood: B
  risk: 9
  action: RR-04
  finding: RGA-020
  negative: false
  disposition: fixed
- id: HZ-CLAIM-006
  node: claim-validation
  guide_word: Reverse
  parameter: status
  deviation: An expired or withdrawn claim is validated.
  cause: The status guard accepts only open.
  consequence: A terminal claim could return to validated.
  safeguard: Status equality on open.
  safeguard_status: holds
  severity: S1
  likelihood: B
  risk: 12
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-007
  node: claim-validation
  guide_word: Other than
  parameter: verdict
  deviation: A verdict outside valid/partial/invalid is supplied.
  cause: claimStatus maps every non-invalid verdict to validated; kassetStatus maps it to rejected.
  consequence: The claim is recorded validated while its K-Asset is rejected.
  safeguard: None; the mappings disagree.
  safeguard_status: none
  severity: S2
  likelihood: B
  risk: 9
  action: RR-04
  finding: RGA-020
  negative: false
  disposition: fixed
- id: HZ-CLAIM-008
  node: claim-validation
  guide_word: Late
  parameter: deadline
  deviation: Validate is called after deadlineHeight.
  cause: The arm checks height > deadlineHeight and moves the claim to expired.
  consequence: A late validation could still create a K-Asset.
  safeguard: Late validation writes expired and returns without making a K-Asset.
  safeguard_status: holds
  severity: S2
  likelihood: B
  risk: 9
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-009
  node: claim-validation
  guide_word: Early
  parameter: deadline
  deviation: Validate is called before the claim deadline.
  cause: This is the intended window.
  consequence: No hazard; the arm proceeds to credential checks.
  safeguard: Deadline guard permits the open window.
  safeguard_status: holds
  severity: S4
  likelihood: A
  risk: 4
  action: none
  finding: '-'
  negative: true
  disposition: no-finding
- id: HZ-CLAIM-010
  node: claim-validation
  guide_word: Before
  parameter: status
