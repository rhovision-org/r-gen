baseline: 527ed95
guide_words:
- No/Not
- More
- Less
- As well as
- Part of
- Reverse
- Other than
- Late
- Early
- Before
- After
- Duplicate/Replay
- Stale
- Substitute/confused-deputy
- Partial commit
nodes:
- id: root-install
  abbr: ROOT
  title: Root registry and install gate
  intent: Only the installer registers component URIs; keys are unique; versions are positive; resolved URIs point at the
    installed component.
  invariants:
  - L1
  - L2
  parameters:
  - installer
  - key
  - uri
  - version
  - kind
  - term-order
  na:
    Late: install has no deadline or height parameter
    Early: install has no deadline or height parameter
- id: identity
  abbr: ID
  title: Identity and directory
  intent: One address maps to one identity; only the owner may update it; the directory is first-writer-wins and monotone.
  invariants:
  - L1
  - L2
  parameters:
  - address
  - owner
  - patch
  - entry
  na:
    Late: identity create/update have no deadline
    Early: identity create/update have no deadline
    Before: create and update are not an ordered pair with a shared guard
    After: create and update are not an ordered pair with a shared guard
- id: issuer-credential-proof
  abbr: CRED
  title: Issuer, credential, and one-shot proof
  intent: Only the issuer issues within its scope; the subject cannot self-issue; a proof is subject-bound, scope-valid, and
    one-shot; revoke and renew are issuer-controlled.
  invariants:
  - C1
  - C2
  - C3
  - L3
  parameters:
  - issuer
  - subject
  - scope
  - status
  - issuedAt
  - expiresAt
  - proof-use
  na: {}
- id: claim-validation
  abbr: CLAIM
  title: Claim, validation, and K-Asset creation
  intent: A claim transitions once from open to validated, withdrawn, or expired; only a qualified non-claimant validator
    validates; validation creates exactly one K-Asset whose status agrees with the verdict.
  invariants:
  - C1
  - C2
  - C3
  parameters:
  - status
  - validator
  - deadline
  - verdict
  - kasset-id
  na: {}
- id: kasset-nesting
  abbr: KASSET
  title: K-Asset lifecycle and nesting
  intent: Approval requires a qualified non-conflicted approver and both proofs; approved assets can be disputed once; applyDecision
    is bound to the open dispute; nesting is acyclic and strictly ordered.
  invariants:
  - K1
  - K2
  - K3
  parameters:
  - status
  - approver
  - approvedAt
  - childRefs
  - proof
  - scope
  na: {}
- id: value-proposition
  abbr: VP
  title: Value proposition and validated proof
  intent: A value proposition validates once by a qualified non-proposer; a validated proof is caller-bound and height-bound;
    a dispute blocks further proofs.
  invariants:
  - V1
  - V2
  parameters:
  - status
  - proposer
  - caller
  - atHeight
  - deadline
  na: {}
- id: oracle
  abbr: ORACLE
  title: Oracle case and execution
  intent: Only the stored adjudicator decides with a credential; execution is exactly once, subject-bound, and applies the
    stored decision; evidence is party-gated while open.
  invariants:
  - O1
  - O2
  parameters:
  - adjudicator
  - subjectRef
  - decision
  - execute
  - evidence
  - deadline
  na: {}
- id: provenance
  abbr: PROV
  title: Provenance records
  intent: Only listed writers anchor or comment; anchors are non-empty, unique, and append-only; a record is created for a
    real asset with at least one writer.
  invariants:
  - P1
  parameters:
  - assetRef
  - writers
  - hash
  - comment
  na:
    Late: anchors have no deadline; they are append-only
    Early: anchors have no deadline; they are append-only
- id: registries-factories
  abbr: REG
  title: Creation registries and factories
  intent: Creation writes an append-only registry entry that verify can resolve; keys are unique; state and registry stay
    consistent.
  invariants:
  - L1
  - L2
  parameters:
  - key
  - entry
  - counter
  - directoryState
  - factoryState
  na:
    Late: registry writes have no deadline
    Early: registry writes have no deadline
- id: deployment-phlo
  abbr: DEPLOY
  title: Deployment, wiring, and resources
  intent: Terms install in dependency order with resolved URIs; private capabilities stay private; deploy cost is bounded
    and manifest-consistent.
  invariants:
  - L1
  - L4
  parameters:
  - term-order
  - uri-binding
  - private-apply
  - phlo
  - install-auth
  na: {}
