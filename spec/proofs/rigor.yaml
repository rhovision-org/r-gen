model_only:
- arm: Claim.reject
  reason: No deployed Claim(@"reject") arm; rejection is folded into Claim.validate via finalizeValidation.
  finding: RGA-008
- arm: Oracle.finishExecute
  reason: No deployed finishExecute arm; execute performs the executing/executed transition inline.
  finding: RGA-008
- arm: Oracle.rollbackExecute
  reason: No deployed rollbackExecute arm; execute reverts to decided on apply failure.
  finding: RGA-008
