schema_version: rgen.audit/v1
audit_id: rgen-core-2026-11
baseline: 527ed95
review:
  status: approved
  date: '2026-11-04'
  reviewers:
  - Patrick Mockridge (owner)
  independent_sample: owner approval after the Phase 1 summary; independent technical review not performed
  note: Owner instruction to proceed. This is acceptance of the audit and backlog, not an independent technical sign-off;
    external review remains required for any S1 and is recommended for the P0 set.
findings:
- id: RGA-001
  title: The headline race theorem is narrower than the public wording
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: proof-claim
  evidence:
  - spec/lean/RGen/RaceFreedom.lean:45
  - spec/lean/RGen/Linear/Exec.lean:63
  - docs/src/reference/race-freedom-proof.md:8
  claim: The core is race-free.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-04
  disposition: accepted
  note: 'The theorem is per cell and per valid Run trace: no two same-cell events share an expected generation. It does not
    cover cross-cell races, proof reuse across arms, deployed guards, or scheduler/interleaving semantics.'
- id: RGA-002
  title: Proof-cell metadata is inert and proof reuse across arms is unproved
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: proof-coverage
  evidence:
  - spec/lean/RGen/Linear/Lift.lean:16
  - spec/lean/RGen/Linear/Lift.lean:23
  - spec/lean/RGen/RaceFreedom.lean:57
  claim: Proof payloads are consumed and cannot be reused.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-03
  disposition: accepted
  note: Phase 2 adds proof-cell membership theorems for seven arms, so the declared proof cells are now checked metadata.
    The trace-ordering theorem (proofCells consumed before the arm commit) and cross-arm reuse theorem are still open.
- id: RGA-003
  title: Versioned independence is missing; the L1 alias is a plain-Store theorem
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: proof-coverage
  evidence:
  - spec/lean/RGen/RaceFreedom.lean:65
  - spec/lean/RGen/Linear/Cell.lean:729
  - spec/lean/RGen/Linear/Cell.lean:916
  - spec/lean/RGen/Linear/Versioned.lean:105
  claim: Independent cells commute in the versioned execution model.
  verdict: unproved
  arms: []
  actions:
  - LR-02
  disposition: accepted
  note: Phase 2 adds VWorld.set_commute and VWorld.commit_commute (final-world equality), but there is still no runExec commute
    theorem and core_independent_cells_commute remains a Store theorem.
- id: RGA-004
  title: No guard equivalence; several model guards differ from the deployed guards
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: model-fidelity
  evidence:
  - spec/lean/RGen/Model/Credential.lean:79
  - spec/lean/RGen/Model/KAsset.lean:67
  - spec/lean/RGen/Model/KAsset.lean:131
  - spec/lean/RGen/Model/Oracle.lean:79
  - contracts/src/deploy/11_credentials.rho:243
  - contracts/src/lib/KAsset.rho:67
  - contracts/src/lib/KAsset.rho:335
  - contracts/src/deploy/30_oracle.rho:96
  - tools/check_arm_guards.py:109
  claim: The model guards are the deployed guards.
  verdict: unproved
  arms:
  - Credential.revoke
  - Credential.renew
  - Claim.validate
  - KAsset.approve
  - KAsset.nest
  - Oracle.evidence
  actions:
  - LR-01
  - LR-08
  disposition: fixed
  note: Phase 2 adds guard_eq for all 32 mutating proved-model arms, aligns credential revoke/expiry, requires the Approver
    credential type, and requires an approved parent for nest. The remaining model/code divergences are recorded in the ledger.
- id: RGA-005
  title: proved-conformance is zero; vectors are emitted but not asserted end-to-end
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: conformance
  evidence:
  - spec/flows/core.yaml:2
  - spec/vectors/core.tsv:1
  - docs/src/reference/formal-model.md:108
  claim: Core arms are proved against their deployed behaviour.
  verdict: unproved
  arms: []
  actions:
  - LR-06
  disposition: fixed
  note: 'Phase 2 promotes eight arms: credential prove, VP validate, VP proveValidated, K-Asset approve/nest, oracle execute/close,
    and provenance anchor. The other proved arms remain unpromoted.'
- id: RGA-006
  title: The axiom audit is a hand-maintained list
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: gate
  evidence:
  - spec/lean/RGen/Audit.lean:15
  - tools/check_lean.py:62
  claim: Every public theorem is axiom-clean.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-07
  disposition: accepted
  note: 'Phase 2 adds check_lean.py --audit-coverage: every Pareto #check must appear in Audit.lean. The audit is now 84 Pareto
    theorems and 194 axiom checks, but public theorems outside the Pareto vocabulary can still escape the list.'
- id: RGA-007
  title: The pair matrix covers 32 rows, not the 48 distinct pairs over modeled cells
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: proof-coverage
  evidence:
  - spec/flows/races.yaml:1
  - tools/check_race_matrix.py:1
  claim: The arm-pair matrix is complete.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-05
  disposition: accepted
  note: Coverage is 32 rows over six modeled cells; the distinct cross-product is 48 pairs. The model-only finish/execute
    row was removed and the provenance anchor/comment pair was added in Phase 2; several cross-primitive pairs remain unproved.
- id: RGA-008
  title: Three deployed mutating arms have no Arm value; three model-only arms remain in the matrix
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: mapping
  evidence:
  - spec/lean/RGen/Arms/Instances.lean:30
  - spec/flows/core.yaml
  - spec/flows/races.yaml
  claim: Every deployed mutating arm has a model transition.
  verdict: proved-but-narrower
  arms:
  - Identity.update
  - IdentityFactory.create
  - ValueProposition.comment
  - Claim.reject
  - Oracle.finishExecute
  - Oracle.rollbackExecute
  actions:
  - LR-00
  disposition: fixed
  note: Phase 2 adds Arm values for Identity.update, IdentityFactory.create, and ValueProposition.comment. claimReject and
    the oracle finish/rollback arms remain model-only and are recorded in the rigor ledger.
- id: RGA-009
  title: Flow manifest contains a phantom arm and a wrong KAsset transition
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: mapping
  evidence:
  - spec/flows/core.yaml:406
  - spec/flows/core.yaml:410
  - contracts/src/deploy/11_credentials.rho:45
  claim: The manifest maps every deployed arm to the matching model declaration.
  verdict: 'false'
  arms:
  - Issuer.revoke
  - Apply.applyDecision
  actions:
  - LR-00
  disposition: fixed
  note: Issuer.revoke is not deployed. KAsset Apply.applyDecision declared RGen.vpDecision instead of RGen.kassetDecision.
    Phase 1 removes the phantom and corrects the transition.
- id: RGA-010
  title: Documentation cites a theorem that does not exist
  severity: S4
  likelihood: C
  risk: 2
  priority: P2
  category: documentation
  evidence:
  - docs/src/reference/race-freedom-proof.md:30
  claim: VWorld.commit_gen_strict is a theorem.
  verdict: 'false'
  arms: []
  actions: []
  disposition: fixed
  note: The reference is removed in Phase 1; the generation step is covered by Event.apply.
- id: RGA-011
  title: Devnet and behavioural suites run only on schedule or manual dispatch
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: gate
  evidence:
  - .github/workflows/ci.yml:70
  claim: The unit and race suites gate every change.
  verdict: proved-but-narrower
  arms: []
  actions:
  - accept-risk
  disposition: accept-risk
  note: Static, docs, Lean, Rust, and parse gates run on every push; devnet suites are nightly because they need a node. Phase
    2 adds targeted negative tests to the nightly job.
- id: RGA-012
  title: core_arm_authority proves data dependence, not permission
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: proof-claim
  evidence:
  - spec/lean/RGen/Linear/Lift.lean:31
  - spec/lean/RGen/RaceFreedom.lean:29
  - docs/src/reference/race-freedom-proof.md:33
  claim: Every arm decision is authorized by its consumed cell.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-04
  disposition: accepted
  note: The theorem says the decision function depends only on the cell value. Who may invoke the arm and which proof must
    be consumed are guard concerns, not consequences of this theorem.
- id: RGA-013
  title: Identity.update is mapped to a different operation in the model
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: model-fidelity
  evidence:
  - contracts/src/deploy/10_identity.rho:60
  - spec/lean/RGen/Model/Identity.lean:68
  - spec/flows/core.yaml:44
  claim: Identity.update is modeled by updateOwner.
  verdict: 'false'
  arms:
  - Identity.update
  actions:
  - LR-00
  - LR-08
  disposition: fixed
  note: Phase 2 adds ProfileState.updateProfile and maps Identity.update to it; updateOwner is retained for the ownership
    model only.
- id: RGA-020
  title: Claim and K-Asset verdict mappings disagree for unknown verdicts
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: state-machine
  evidence:
  - contracts/src/deploy/20_claim.rho:48
  - contracts/src/deploy/20_claim.rho:55
  - contracts/src/deploy/20_claim.rho:192
  claim: A validation verdict yields a consistent Claim and K-Asset status.
  verdict: 'false'
  arms:
  - Claim.validate
  actions:
  - RR-04
  disposition: fixed
  note: 'Phase 2 aligns claimStatus and kassetStatus: valid -> validated/validated, partial -> validated/conditional, invalid/unknown
    -> rejected/rejected. The claim still writes a rejected K-Asset for an unknown verdict; the inconsistency is gone but
    pre-write rejection remains a follow-up.'
- id: RGA-021
  title: ValueProposition.proveValidated accepts a caller-chosen height
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: time
  evidence:
  - contracts/src/deploy/22_value.rho:183
  - contracts/src/lib/Proof.rho:54
  - contracts/src/lib/KAsset.rho:43
  claim: A validated proof is bound to the chain height at issuance.
  verdict: 'false'
  arms:
  - ValueProposition.proveValidated
  actions:
  - RR-03
  disposition: fixed
  note: Phase 2 adds a nowHeight read and rejects proveValidated when the supplied height differs from chain height, so the
    proof payload can no longer carry an arbitrary height.
- id: RGA-022
  title: Provenance creation is unauthenticated, unbound to an asset, and permits empty writers
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: authority
  evidence:
  - contracts/src/deploy/40_provenance.rho:23
  - contracts/src/deploy/40_provenance.rho:49
  claim: Provenance records are bound to an asset and have at least one writer.
  verdict: 'false'
  arms:
  - ProvenanceFactory.create
  actions:
  - RR-02
  disposition: accepted
  note: Phase 2 adds an authenticated creator, rejects an empty writer list, and rejects an assetRef with no URI. The asset
    is still not resolved against a registry; provenance remains advisory.
- id: RGA-023
  title: OracleFactory.open is public and trusts caller-supplied parties and adjudicator reference
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: authority
  evidence:
  - contracts/src/deploy/30_oracle.rho:27
  - contracts/src/deploy/30_oracle.rho:57
  - contracts/src/deploy/30_oracle.rho:120
  claim: A dispute case is opened by the affected subject for the stored adjudicator.
  verdict: 'false'
  arms:
  - OracleFactory.open
  actions:
  - RR-01
  disposition: accepted
  note: Phase 2 binds oracle open to the authenticated opener, requires it to equal caseReq.openedBy, and rejects empty subjectRef,
    parties, or deadline. Parties and subjectRef are still caller-supplied rather than registry-derived; decide and execute
    stay bound to the stored adjudicator and private Apply.
- id: RGA-024
  title: Oracle execution spans two contracts without an atomic application receipt
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: liveness
  evidence:
  - contracts/src/deploy/30_oracle.rho:152
  - contracts/src/lib/KAsset.rho:438
  claim: Execution applies the decision exactly once and records the outcome.
  verdict: proved-but-narrower
  arms:
  - OracleCase.execute
  - Apply.applyDecision
  actions:
  - RR-08
  disposition: accepted
  note: 'Phase 2 makes Apply.applyDecision idempotent for a matching terminal status: a retry returns "already applied" instead
    of "not disputed", so OracleCase.execute can record the success after a partial cross-contract failure. There is still
    no explicit receipt field for an audit trail or for an ambiguous failure.'
- id: RGA-025
  title: KAsset.nest performs unbounded recursive resolve/prove/take work
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: resource
  evidence:
  - contracts/src/lib/KAsset.rho:260
  - contracts/src/lib/KAsset.rho:279
  - contracts/src/lib/KAsset.rho:330
  claim: Nest has a bounded cost.
  verdict: unproved
  arms:
  - KAsset.nest
  actions:
  - RR-05
  disposition: fixed
  note: Phase 2 caps a nest batch at 32 children and the parent list at 64, rejecting larger batches before proof consumption.
- id: RGA-026
  title: Claim, VP, and oracle creation accept unvalidated deadlines and orderings
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: time
  evidence:
  - contracts/src/deploy/20_claim.rho:30
  - contracts/src/deploy/22_value.rho:23
  - contracts/src/deploy/30_oracle.rho:57
  claim: Creation rejects impossible or already-expired schedules.
  verdict: 'false'
  arms:
  - ClaimFactory.create
  - ValuePropositionFactory.propose
  - OracleFactory.open
  actions:
  - RR-07
  disposition: accepted
  note: Phase 2 requires a claim deadline and rejects a comment window after it; claim and VP creation now require the deadline
    to be in the future. Oracle open checks that a deadline is present but not that it is future-dated.
- id: RGA-027
  title: Credential.check accepts a caller-nominated subject and must not be used as authority
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: authority
  evidence:
  - contracts/src/deploy/11_credentials.rho:139
  - tools/check_concurrency.py:30
  claim: A credential check is an authorization decision.
  verdict: proved-but-narrower
  arms:
  - Credential.check
  actions:
  - RR-06
  disposition: accepted
  note: The advisory arm compares the caller argument to the stored subject. It is not signature-derived and no core commit
    may use it; the static gate forbids X!("check") as a commit authority. The hazard is a future caller treating the advisory
    result as a signature.
- id: RGA-028
  title: Identity is not a prerequisite for claim or comment participation
  severity: S4
  likelihood: A
  risk: 4
  priority: P1
  category: design
  evidence:
  - contracts/src/deploy/20_claim.rho:120
  - harness/unit_claim.py:31
  claim: Participants must have an identity record.
  verdict: 'false'
  arms:
  - Claim.comment
  - Claim.validate
  actions:
  - RR-09
  disposition: accepted
  note: Claim and comment paths authenticate a REV address but do not require an Identity record. This may be intentional
    (permissionless participation); it is currently undocumented and untested as a policy.
- id: RGA-029
  title: Root, directory, and factory registries grow without a cap and serialize creates
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: resource
  evidence:
  - contracts/src/deploy/00_root.rho:39
  - contracts/src/deploy/10_identity.rho:40
  - contracts/src/deploy/11_credentials.rho:111
  - contracts/components.json:8
  claim: Registry growth and create serialization are bounded or measured.
  verdict: unproved
  arms:
  - GenRoot.register
  - IdentityFactory.create
  - CredentialFactory.issue
  actions:
  - RR-10
  disposition: accepted
  note: Registries are append-only maps and directoryState/factoryState are documented serialization points. Every identity
    or credential create consumes the same root cell. No cap, sharding, or load metric exists.
- id: RGA-031
  title: IdentityFactory.create writes the identity and directory without a recovery record
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/deploy/10_identity.rho:40
  - contracts/src/deploy/10_identity.rho:81
  - contracts/src/deploy/10_identity.rho:86
  claim: Create either publishes a complete identity and directory entry or nothing.
  verdict: unproved
  arms:
  - IdentityFactory.create
  actions:
  - RR-11
  disposition: accepted
  note: The arm consumes directoryState, writes identityState, registers the Identity bundle, then writes directoryState.
    A failure between those writes can leave an identity cell that the directory does not reference, or a directory entry
    whose bundle was not registered. The model proves first-writer-wins only.
- id: RGA-032
  title: Claim validation mints a K-Asset before the claim state write is complete
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/deploy/20_claim.rho:192
  - contracts/src/deploy/20_claim.rho:200
  - contracts/src/deploy/20_claim.rho:227
  claim: Validation records the claim transition and the K-Asset atomically.
  verdict: unproved
  arms:
  - Claim.validate
  actions:
  - RR-11
  disposition: accepted
  note: finalizeValidation creates the K-Asset, then writes claimState with the validation and K-Asset references. The model's
    "exactly one K-Asset" theorem assumes the mint and the claim update are one step; the deployed arm has a cross-cell window.
- id: RGA-033
  title: KAsset.nest consumes child proofs before the parent commit is known to succeed
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/lib/KAsset.rho:279
  - contracts/src/lib/KAsset.rho:343
  - contracts/src/lib/KAsset.rho:356
  claim: A failed nest leaves the child proofs and the parent state consistent.
  verdict: unproved
  arms:
  - KAsset.nest
  actions:
  - RR-11
  disposition: accepted
  note: nestProofs resolves and takes each child approval proof before the parent writes childRefs. If the parent write or
    acknowledgement fails, the child proofs are used while the parent is unchanged. The two-phase peek/recheck narrows the
    state race but not the proof-consumption window.
- id: RGA-030
  title: K-Asset nesting is a forest, not a tree; a child may have multiple parents
  severity: S4
  likelihood: B
  risk: 3
  priority: P2
  category: design
  evidence:
  - contracts/src/lib/KAsset.rho:1
  - contracts/src/lib/KAsset.rho:330
  claim: Nesting is a forest with a unique parent per child.
  verdict: proved-but-narrower
  arms:
  - KAsset.nest
  actions:
  - accept-risk
  disposition: accept-risk
  note: The contract refuses same-parent duplicates and cycles but allows a child approved by a different parent to be nested
    again. The model theorem is about acyclicity and strict order, not unique parentage. Documentation should say "forest"
    precisely.
