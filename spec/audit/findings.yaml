- id: RGA-001
  title: The headline race theorem is narrower than the public wording
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: proof-claim
  evidence:
  - spec/lean/RGen/RaceFreedom.lean:45
  - spec/lean/RGen/Linear/Exec.lean:63
  - docs/src/reference/race-freedom-proof.md:8
  claim: The core is race-free.
  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-04
  disposition: fixed
  note: 'The theorem is per cell and per valid Run trace: no two same-cell events share an expected generation. It does not
    cover cross-cell races, proof reuse across arms, deployed guards, or scheduler/interleaving semantics.'
- id: RGA-002
