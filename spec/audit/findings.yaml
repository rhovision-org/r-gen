- id: RGA-048
  title: Issuer.authorize trusts a caller-nominated address as the issuer
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/11_credentials.rho:69
  - contracts/src/deploy/11_credentials.rho:134
  claim: Issuer.authorize accepts only the deployer that controls the issuer identity.
  verdict: unproved
  arms:
  - Issuer.authorize
  actions: []
  disposition: fixed
  note: The arm was published in bundle+{*Issuer} and compared a caller-supplied address to issuerState.subject. Any deployer
    could pass the genesis address and receive (true, true). The factory derived the caller correctly, so no state changed,
    but the arm was not an authority check. It now takes a dId name and derives the caller with authSubject. RT-031 records the
    pre-fix (true, true) and the post-fix refusal.
- id: RGA-049
  title: KAsset.nest can link a self-registered fake child because it trusts a registry-resolved proof
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: capability
  evidence:
  - contracts/src/lib/KAsset.rho:293
  - contracts/src/lib/KAsset.rho:369
  - contracts/src/lib/KAsset.rho:404
  claim: A nested child is the K-Asset named by a genuine Claim's kassetRef.
  verdict: unproved
  arms:
  - KAsset.nest
  actions:
  - RR-12
  disposition: fixed
  note: The pre-pass compared the genuine Claim's kassetRef.uri to the child's self-reported get().uri, while phase 2 resolved
    the caller-supplied ref.uri and trusted the proof minted by that process. A fake child that answered get/proveApproved
    could be nested. The fix compares the Claim's kassetRef.uri to ref.uri, resolves the child from that URI, and requires the
    proof id/uri to match. RT-032 records the pre-fix (true, "ok") and the post-fix refusal.
- id: RGA-050
  title: makeKAsset returned the K-Asset bundle in a reply value
  severity: S4
  likelihood: B
  risk: 3
  priority: P2
  category: capability
  evidence:
  - contracts/src/lib/KAsset.rho:609
  - contracts/src/deploy/20_claim.rho:259
  claim: No capability is delivered as a reply value.
  verdict: unproved
  arms: []
  actions:
  - RR-12
  disposition: fixed
  note: The private Claim channel received (true, bundle+{*KAsset}, uri) and discarded the bundle. The same capability is
    public through the registry URI, so the reply added no authority, only an escape surface. makeKAsset now returns (true, uri).
- id: RGA-051
  title: The client trusts the manifest's Root URI without an on-chain or signed anchor
  severity: S1
  likelihood: C
  risk: 8
  priority: P0
  category: capability
  evidence:
  - crates/rgen-core/src/manifest.rs:47
  - crates/rgen-core/src/manifest.rs:110
  - web/src/lib/store.ts:79
  claim: A client can distinguish the genuine Root from a substituted manifest.
  verdict: proved-but-narrower
  arms: []
  actions: []
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: The manifest is an unsigned file of URI designations. Pinning is now implemented and tested, not merely proposed.
    Manifest::from_json_pinned refuses a substituted Root, and the web client refuses a fetched, cached or pasted manifest
    whose Root differs from VITE_RGEN_ROOT_URI. The default build remains trust-on-first-use because pinning is opt-in; a
    signed manifest is still the stronger fix. Risk accepted until an S1 external review or 2027-05-08, whichever is first.
- id: RGA-052
  title: The installer is both the Root writer and the genesis Issuer
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: authority
  evidence:
  - contracts/src/deploy/00_root.rho:63
  - contracts/src/deploy/11_credentials.rho:48
  claim: Root registration and qualification issuance are separate authorities.
  verdict: unproved
  arms: []
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: The 00_root deployer becomes the installer and the 11_credentials deployer becomes the genesis Issuer. In the installer
    they are one key. Loss of that key freezes Root updates and new qualifications; there is no rotate arm. A governance
    extension must separate or rotate them.
- id: RGA-053
  title: Registry insertion is unauthenticated, so a URI is a designation and not an endorsement
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/11_credentials.rho:333
  - contracts/src/deploy/11_credentials.rho:109
  claim: Holding a registry URI grants the authority of the term at that URI.
  verdict: unproved
  arms: []
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: Any deploy can insert an arbitrary term and receive a fresh URI. The core compensates with installer-gated Root
    entries and factory issuance registries. Every consumer must verify factory membership before treating a URI as an
    entity; the pre-fix KAsset.nest was the one place that did not.
- id: RGA-054
  title: Oracle execute, expire and close, and Claim expire, have no caller check
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: authority
  evidence:
  - contracts/src/deploy/30_oracle.rho:203
  - contracts/src/deploy/30_oracle.rho:240
  - contracts/src/deploy/30_oracle.rho:261
  - contracts/src/deploy/20_claim.rho:200
  claim: Only a party or the adjudicator can advance a case or close a claim.
  verdict: unproved
  arms:
  - OracleCase.execute
  - OracleCase.expire
  - OracleCase.close
  - Claim.expire
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: These are open clock/transition arms. execute replays only the adjudicator's stored decision through the case-bound
    Apply; expire refuses before the deadline; close refuses until executed or expired; Claim.expire refuses before the
    deadline. A third party can pay phlo to advance them, which is a crank, not a decision.
- id: RGA-055
  title: An approval survives revocation of the approver credential
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/lib/KAsset.rho:33
  - contracts/src/deploy/11_credentials.rho:258
  claim: Revoking the approver credential invalidates the approval.
  verdict: unproved
  arms:
  - KAsset.approve
  - Credential.revoke
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: The credential proof is checked at the approval height; the approved status is a durable state transition. A later
    revocation does not de-approve. The proof is height-bound, so it cannot be reused at a later height, but the approval
    remains. De-approval would need a new transition and a policy for the liability record.
- id: RGA-056
  title: The SDK resolve_all does not compare resolved components with the manifest copies
  severity: S4
  likelihood: B
  risk: 3
  priority: P2
  category: capability
  evidence:
  - crates/rgen-sdk/src/client.rs:213
  - crates/rgen-core/src/manifest.rs:3
  claim: resolve_all verifies the manifest component copies against Root.
  verdict: unproved
  arms: []
  actions: []
  disposition: fixed
  note: The doc comment claimed the comparison, but resolve_all only inserted Root's answers. The comment now states the
    actual boundary and Manifest::component is documented as a convenience copy. rgen-cli manifest verify performs the
    comparison; no production caller uses Manifest::component.
- id: RGA-057
  title: Resolved components are cached for the client lifetime with no refresh method
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: capability
  evidence:
  - crates/rgen-sdk/src/client.rs:181
  claim: A client observes a reinstall or Root rotation without being recreated.
  verdict: unproved
  arms: []
  actions: []
  disposition: fixed
  note: The comment named refresh_components but the method did not exist. Added Client::refresh_components to clear the
    cache; a long-lived client must call it after a reinstall or Root rotation.
- id: RGA-058
  title: The installer wrote a manifest from deploy output without checking the Root acknowledgement
  severity: S2
  likelihood: C
  risk: 6
  priority: P1
  category: capability
  evidence:
  - harness/install.py:180
  - contracts/src/deploy/00_root.rho:39
  claim: install fails when a component registration is refused.
  verdict: unproved
  arms: []
  actions:
  - RR-13
  disposition: fixed
  note: Every term emitted its deployId even when GenRoot.register returned (false, reason). install.py now resolves all
    nine keys through Root before writing the manifest and exits non-zero on a missing or different URI (9/9 in the normal
    path).
- id: RGA-059
  title: The installer could deploy a dependent term with a dry-run placeholder URI
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: capability
  evidence:
  - harness/install.py:182
  claim: A real install never renders a term against rho:id:dryrun-*.
  verdict: unproved
  arms: []
  actions:
  - RR-13
  disposition: fixed
  note: If a component label was absent from a deploy, common kept the dry-run default and dependent terms were rendered
    against it. install.py now rejects a rendered term that still contains a dry-run placeholder before deploying it.
- id: RGA-060
  title: A K-Asset validator could not open a dispute because the parties list omitted the validator
  severity: S2
  likelihood: A
  risk: 12
  priority: P0
  category: capability
  evidence:
  - contracts/src/lib/KAsset.rho:504
  - contracts/src/lib/KAsset.rho:517
  claim: A K-Asset claimant or validator can open a dispute.
  verdict: unproved
  arms:
  - KAsset.openDispute
  actions: []
  disposition: fixed
  note: openDisputeGate allowed the validator, but openOracleCase passed parties=[claimant, approver]. OracleFactory requires
    the opener to be in parties, so a validator opening was refused with "case fields". parties now includes the validator.
- id: RGA-061
  title: GenRoot.register consumed rootState before authenticating the caller
  severity: S2
  likelihood: A
  risk: 12
  priority: P0
  category: capability
  evidence:
  - contracts/src/deploy/00_root.rho:39
  claim: A malformed register call cannot destroy the Root directory.
  verdict: unproved
  arms:
  - GenRoot.register
  actions:
  - RR-13
  disposition: fixed
  note: The arm consumed rootState and then called authSubject with the caller's dId. A fresh channel in the dId position
    could block the auth continuation, and the blocked continuation commits the consumed cell, leaving every resolve/get/keys
    call blocked. Authentication now precedes the rootState consume and a (false, _) auth reply is returned as "not installer".
- id: RGA-062
  title: A validated value proposition stays validated after the validator credential is revoked
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/22_value.rho:190
  claim: Revoking the validator credential invalidates the validation and its proofs.
  verdict: unproved
  arms:
  - ValueProposition.proveValidated
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: validate checks the credential once and writes status validated; proveValidated mints from that durable status
    without re-reading the credential. The proof is height-bound, but a revoked validator can mint a fresh proof at a later
    height. This is the validation analogue of approval durability (RGA-055); devalidation would need a new transition.
- id: RGA-063
  title: Provenance writers cannot be revoked or attenuated
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/40_provenance.rho:36
  claim: Provenance write authority can be withdrawn after creation.
  verdict: unproved
  arms:
  - Provenance.anchor
  - Provenance.comment
  actions:
  - accept-risk
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: The writers list is fixed at create. A compromised writer keeps appending anchors and comments for the cell's
    lifetime. Provenance is advisory and no core arm uses it as authority; a removeWriter arm would add a state transition
    and a writer-consent policy.
- id: RGA-064
  title: An expired dispute leaves the K-Asset in disputed status with no restoration path
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: authority
  evidence:
  - contracts/src/lib/KAsset.rho:728
  - contracts/src/lib/KAsset.rho:806
  - contracts/src/deploy/30_oracle.rho:278
  - contracts/src/deploy/22_value.rho:349
  claim: Every disputed K-Asset eventually leaves disputed status.
  verdict: proved
  arms:
  - KAsset.openDispute
  - OracleCase.expire
  actions: []
  disposition: fixed
  note: openDispute records disputePrevStatus. OracleCase.expire writes an "expiring" receipt, calls the subject's
    Apply.expireCase, and then marks the case expired; a retry from "expiring" re-notifies. The K-Asset and VP restore the
    prior status and mark the dispute record expired. unit_oracle asserts an expired dispute returns the K-Asset to
    approved.
- id: RGA-065
  title: A concurrent validate and resume can mint a second orphaned K-Asset for one claim
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/20_claim.rho:249
  - contracts/src/deploy/20_claim.rho:345
  claim: A claim has exactly one K-Asset in the registry.
  verdict: proved-but-narrower
  arms:
  - Claim.validate
  - Claim.resume
  actions:
  - RR-16
  disposition: fixed
  note: finalizeWith is the only minter; resumeFinalize commits a receipt only when it names a kassetRef and the claim is
    still validating. A Nil kassetRef answers "not minted" and leaves the claim, and the receipt now carries validationRef
    so the commit is complete. ClaimMint.lean proves resume_cannot_mint. unit_claim refuses resume on open and final claims
    and asserts the kassetRef is unchanged. A stranded pre-mint receipt needs a separate lease protocol, not a resume mint.
- id: RGA-066
  title: Caller-supplied maps can carry a name into durable state and the public get reply
  severity: S3
  likelihood: D
  risk: 2
  priority: P2
  category: capability
  evidence:
  - contracts/src/deploy/30_oracle.rho:184
  - contracts/src/deploy/40_provenance.rho:35
  claim: No capability can be serialized into state or a get reply.
  verdict: unproved
  arms: []
  actions:
  - accept-risk
  disposition: accept-risk
  note: OracleCase stores the decision map and Provenance stores assetRef wholesale. If the @ pattern accepts a process
    containing a name, a caller could leak it to every get reader. The state checker scans for a direct *Name in a state
    send but not a name nested in a caller map. No exploit was reproduced; confidence is low. A schema that rejects
    name-bearing maps would settle it.
- id: RGA-067
  title: checkCredentialProof does not compare the proof requirement with the consumer requirement
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/lib/Proof.rho:10
  - contracts/src/lib/Proof.rho:18
  claim: A proof accepted for a strong requirement was minted against that requirement.
  verdict: proved
  arms: []
  actions: []
  disposition: fixed
  note: checkCredentialProof now compares the proof payload's requirement with the consumer requirement as well as subject,
    credentialUri and atHeight. proveAndCheck threads the same rq through prove, the reply and the take. Every in-tree
    consumer uses this path; the primitive suites exercise valid, wrong-subject and wrong-scope proofs.
- id: RGA-068
  title: proveAndCheck trusts a caller-supplied credential URI without checking factory membership
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: capability
  evidence:
  - contracts/src/lib/Proof.rho:28
  - contracts/src/lib/Proof.rho:31
  claim: proveAndCheck only resolves credentials issued by the credential factory.
  verdict: proved
  arms: []
  actions: []
  disposition: fixed
  note: proveAndCheck now calls CredentialFactory.verify before resolving the URI and refuses a URI the factory did not issue.
    The helper is still private; the factory capability is passed by each term. unit_claim, unit_kasset and unit_oracle
    exercise forged credential and adjudicator refusals through this path.
- id: RGA-069
  title: CredentialFactory.issue held factoryState across the registry insert
  severity: S2
  likelihood: C
  risk: 6
  priority: P1
  category: capability
  evidence:
  - contracts/src/deploy/11_credentials.rho:138
  - contracts/src/deploy/11_credentials.rho:333
  claim: A blocked registry insert cannot lose the credential issuance registry.
  verdict: unproved
  arms:
  - CredentialFactory.issue
  actions: []
  disposition: fixed
  note: The arm consumed factoryState before creating the Credential and calling rs!. A blocked rs! continuation
    committed the consumed registry cell, so verify/count/issue could block forever while the Credential cell existed.
    The consume now happens after the URI is known, and the self-issue refusal no longer touches the cell.
- id: RGA-070
  title: The subject hands its private Apply to the installer-wired oracle factory
  severity: S1
  likelihood: C
  risk: 8
  priority: P0
  category: capability
  evidence:
  - contracts/src/lib/KAsset.rho:14
  - contracts/src/lib/KAsset.rho:19
  - contracts/src/deploy/22_value.rho:51
  claim: The private Apply is sent only to the oracle factory the Root registry names.
  verdict: proved-but-narrower
  arms:
  - KAsset.openDispute
  - ValueProposition.openDispute
  actions:
  - RR-17
  disposition: fixed
  note: makeKAsset resolves component:oracle-factory from Root and refuses to create the K-Asset when the wired URI differs;
    the VP factory publishes only when the wired oracle URI matches Root. The Apply handoff stays case-bound. The negative
    mismatched-manifest path is a deploy-time refusal and is not exercised by a dedicated suite; it needs external review.
- id: RGA-071
  title: A decided case whose subject Apply keeps refusing has no terminal close path
  severity: S3
  likelihood: C
  risk: 4
  priority: P1
  category: liveness
  evidence:
  - contracts/src/deploy/30_oracle.rho:205
  - contracts/src/deploy/30_oracle.rho:299
  claim: A decided case can always reach closed.
  verdict: unproved
  arms:
  - OracleCase.execute
  - OracleCase.close
  actions: []
  disposition: accept-risk
  owner: patrick
  expiry: '2027-05-08'
  note: execute retries only the stored decision through the case-bound Apply. If the subject refuses forever, the case
    returns to decided with a failed execution receipt and close refuses because it accepts only executed or expired. A
    terminal abandon path needs a liability policy (adjudicator-signed abandon or timeout close). Accepted until that policy
    is written; RGA-024's receipt is the recovery evidence for a failure that is retryable.

