- id: RGA-031
  title: IdentityFactory.create writes the identity and directory without a recovery record
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/deploy/10_identity.rho:40
  - contracts/src/deploy/10_identity.rho:81
  - contracts/src/deploy/10_identity.rho:86
