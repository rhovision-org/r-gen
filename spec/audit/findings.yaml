- id: RGA-022
  title: Provenance creation is unauthenticated, unbound to an asset, and permits empty writers
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: authority
  evidence:
  - contracts/src/deploy/40_provenance.rho:28
  - contracts/src/deploy/40_provenance.rho:56
  - contracts/src/deploy/40_provenance.rho:77
  - contracts/src/deploy/40_provenance.rho:122
  - contracts/src/deploy/40_provenance.rho:162
  - harness/unit_provenance.py
  claim: Provenance records are bound to the asset the creator holds and have at least one writer.
  verdict: proved-but-narrower
  arms:
  - ProvenanceFactory.createBound
  actions:
  - RR-02
  disposition: fixed
  note: createBound requires authOwner, takes a subject capability, reads the subject cell, and derives assetRef from the
    subject's own uri; the raw free assetRef arm is gone. Empty writers are refused and unit_provenance asserts the stored
    assetRef equals the K-Asset uri. Anchors require a non-empty hash and a parentHash that already exists; comments refuse
    an empty hash. Residual is that a third party can still create an advisory record for a public subject; the record is
    bound to that subject but is not an attestation that the subject is a genuine K-Asset.
- id: RGA-023
  title: OracleFactory.open is public and trusts caller-supplied parties and adjudicator reference
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: authority
  evidence:
  - contracts/src/deploy/30_oracle.rho:85
  - contracts/src/deploy/30_oracle.rho:119
  - contracts/src/lib/KAsset.rho:684
  - contracts/src/deploy/22_value.rho:231
  - harness/unit_oracle.py
  - harness/unit_kasset.py
  claim: A dispute case is opened from a one-shot subject snapshot; the caller cannot supply subjectRef or parties.
  verdict: proved-but-narrower
  arms:
  - OracleFactory.openBound
  actions:
  - RR-01
  disposition: fixed
  note: The raw open arm is removed. KAsset.openDispute and ValueProposition.openDispute mint a one-shot snapshot containing
    subjectRef, subjectUri, parties and discipline/jurisdiction and pass the private Apply. openBound consumes the snapshot,
    derives subjectRef/parties/requirement, checks the opener is a party and the adjudicator is credentialed, and stores the
    subjectUri. Residual is that a forged snapshot can create an advisory case, but it carries the forger's own Apply and
    cannot affect a real subject.
- id: RGA-024
  title: Oracle execution spans two contracts without an atomic application receipt
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: liveness
  evidence:
  - contracts/src/deploy/30_oracle.rho:152
  - contracts/src/lib/KAsset.rho:438
  claim: Execution applies the decision exactly once and records the outcome.
  verdict: proved-but-narrower
  arms:
  - OracleCase.execute
  - Apply.applyDecision
  actions:
  - RR-08
  disposition: fixed
  note: Phase 3 records an execution receipt (pending/applied/failed, caseId, decision, outcome) and Apply.applyDecision is
    idempotent for a matching terminal status, so a retry can record success after a partial cross-contract failure. The devnet
    suite cannot inject a crash; the receipt remains the recovery evidence.
- id: RGA-025
  title: KAsset.nest performs unbounded recursive resolve/prove/take work
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: resource
  evidence:
  - contracts/src/lib/KAsset.rho:260
  - contracts/src/lib/KAsset.rho:279
  - contracts/src/lib/KAsset.rho:330
  claim: Nest has a bounded cost.
  verdict: unproved
  arms:
  - KAsset.nest
  actions:
  - RR-05
  disposition: fixed
  note: Phase 2 caps a nest batch at 32 children and the parent list at 64, rejecting larger batches before proof consumption.
- id: RGA-026
  title: Claim, VP, and oracle creation accept unvalidated deadlines and orderings
  severity: S3
  likelihood: A
  risk: 8
  priority: P1
  category: time
  evidence:
  - contracts/src/deploy/20_claim.rho:30
  - contracts/src/deploy/22_value.rho:23
  - contracts/src/deploy/30_oracle.rho:57
  claim: Creation rejects impossible or already-expired schedules.
  verdict: 'false'
  arms:
  - ClaimFactory.create
  - ValuePropositionFactory.propose
  - OracleFactory.openBound
  actions:
  - RR-07
  disposition: fixed
  note: Claim and VP creation require a future deadline; with RGA-023 the oracle's caseReqOk receives a bound case and rejects
    deadline <= now. unit_claim refuses a past claim deadline and unit_oracle refuses a past dispute deadline without
    changing the K-Asset state.
- id: RGA-027
  title: Credential.check accepts a caller-nominated subject and must not be used as authority
  severity: S3
  likelihood: B
  risk: 6
  priority: P1
  category: authority
  evidence:
  - contracts/src/deploy/11_credentials.rho:139
  - tools/check_concurrency.py:30
  claim: A credential check is an authorization decision.
  verdict: proved-but-narrower
  arms:
  - Credential.check
  actions:
  - RR-06
  disposition: fixed
  note: The advisory arm compares the caller argument to the stored subject. It is not signature-derived and no core commit
    may use it; the static gate forbids X!("check") as a commit authority. unit_credentials now exercises the true, wrong
    caller and wrong scope cases with an explicit caller address. The residual hazard is a future caller treating the
    advisory result as a signature; the gate and the documentation are the control.
- id: RGA-028
  title: Identity is not a prerequisite for claim or comment participation
  severity: S4
  likelihood: A
  risk: 4
  priority: P1
  category: design
  evidence:
  - contracts/src/deploy/20_claim.rho:120
  - harness/unit_claim.py:31
  claim: Participants must have an identity record.
  verdict: 'false'
  arms:
  - Claim.comment
  - Claim.validate
  actions:
  - RR-09
  disposition: fixed
  note: Permissionless participation is the documented policy. Claim and comment authenticate a REV address but do not require
    an Identity record; unit_claim exercises an unregistered commenter, and validation still requires a credential proof.
    Identity enforcement remains an extension decision, not a core requirement.
