  expiry: '2027-05-08'
  note: Any deployer can mint a fresh one-shot proof for an approved K-Asset. The proof carries approval data, no registry
    entry and no victim state; the caller pays. Parent-owned nesting uses this proof as its authority.
- id: RGA-041
  title: A value-proposition validator could not open a dispute as itself
