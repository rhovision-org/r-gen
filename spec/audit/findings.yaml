- id: RGA-032
  title: Claim validation mints a K-Asset before the claim state write is complete
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/deploy/20_claim.rho:192
  - contracts/src/deploy/20_claim.rho:200
  - contracts/src/deploy/20_claim.rho:227
  claim: Validation records the claim transition and the K-Asset atomically.
  verdict: unproved
  arms:
  - Claim.validate
  actions:
  - RR-11
  disposition: fixed
  note: Phase 3 writes a validating receipt (claim status, validationRef, kassetRef) before the final claim write and adds
    Claim.resume to complete it. A failure before the receipt write remains the residual window; the devnet suite cannot inject
    it.
- id: RGA-033
  title: KAsset.nest consumes child proofs before the parent commit is known to succeed
  severity: S2
  likelihood: B
  risk: 9
  priority: P0
  category: atomicity
  evidence:
  - contracts/src/lib/KAsset.rho:416
  - contracts/src/lib/KAsset.rho:482
  - contracts/src/lib/KAsset.rho:521
  - contracts/src/lib/KAsset.rho:586
  - contracts/src/lib/KAsset.rho:642
  claim: A failed nest leaves the child proofs and the parent state consistent.
  verdict: proved-but-narrower
  arms:
  - KAsset.nest
  - KAsset.resumeNest
  - KAsset.abortNest
  actions:
  - RR-15
  disposition: fixed
  note: nestReserve writes a receipt before any proof is taken; recordNestProof records each consumed proof in the receipt;
    nestCommit commits from the receipt without external calls; resumeNest re-drives the missing suffix and abortNest clears
    the receipt. NestCrash.lean proves the reservation discipline. unit_kasset drives an unsorted batch through reserve,
    partial take, refused retry, failed resume, abort and a successful re-nest; mid-deploy crash injection remains skipped.
- id: RGA-030
  title: K-Asset nesting is a forest, not a tree; a child may have multiple parents
  severity: S4
  likelihood: B
  risk: 3
  priority: P2
  category: design
  evidence:
  - contracts/src/lib/KAsset.rho:1
  - contracts/src/lib/KAsset.rho:330
  claim: Nesting is a forest with a unique parent per child.
  verdict: proved-but-narrower
  arms:
  - KAsset.nest
  actions:
  - accept-risk
  disposition: accept-risk
  note: The contract refuses same-parent duplicates and cycles but allows a child approved by a different parent to be nested
    again. The model theorem is about acyclicity and strict order, not unique parentage. Documentation should say "forest"
    precisely.
