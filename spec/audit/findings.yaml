  verdict: proved-but-narrower
  arms: []
  actions:
  - LR-03
  disposition: fixed
  note: 'Phase 3 adds Linear/Consumption.lean: a well-formed trace consumes every declared proof cell before the arm commit
    and cannot consume a proof cell twice. This is a model-level trace discipline, not a refinement of the deployed private
    capability.'
