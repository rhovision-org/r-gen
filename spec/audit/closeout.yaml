- id: RGA-049
  priority: P0
  decision: fixed
  owner: patrick
  rationale: The pre-pass compared the genuine Claim's kassetRef.uri to the child's self-reported get().uri, while
    phase 2 resolved the caller-supplied ref.uri and trusted the proof minted by that process. A fake child that
    answered get/proveApproved could be nested. The fix compares the Claim's kassetRef.uri to ref.uri, resolves
    the child from that URI, and requires the proof id/uri to match. RT-032 records the pre-fix (true, "ok") and
    the post-fix refusal.
  evidence:
  - kind: code
    ref: contracts/src/lib/KAsset.rho:293
  - kind: code
