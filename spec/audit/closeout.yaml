- id: RGA-048
  priority: P1
  decision: fixed
  owner: patrick
  rationale: The arm was published in bundle+{*Issuer} and compared a caller-supplied address to issuerState.subject.
    Any deployer could pass the genesis address and receive (true, true). The factory derived the caller correctly,
    so no state changed, but the arm was not an authority check. It now takes a dId name and derives the caller
    with authSubject. RT-031 records the pre-fix (true, true) and the post-fix refusal.
  evidence:
  - kind: code
    ref: contracts/src/deploy/11_credentials.rho:69
  - kind: code
    ref: contracts/src/deploy/11_credentials.rho:134
  closed_on: '2026-11-08'
