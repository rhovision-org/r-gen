  owner: patrick
  rationale: runExec_some_iff_cells characterizes success by per-cell projections; runExec_commute_disjoint proves
    runExec w (es1++es2) = runExec w (es2++es1) for DisjointEvents, including stale and rejected traces. core_independent_cells_commute
    is now the versioned theorem; the plain-Store result remains as core_independent_stores_commute. Both are in
    the axiom audit.
