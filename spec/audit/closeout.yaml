- id: RGA-061
  priority: P0
  decision: fixed
  owner: patrick
  rationale: The arm consumed rootState and then called authSubject with the caller's dId. A fresh channel in the
    dId position could block the auth continuation, and the blocked continuation commits the consumed cell, leaving
    every resolve/get/keys call blocked. Authentication now precedes the rootState consume and a (false, _) auth
    reply is returned as "not installer".
