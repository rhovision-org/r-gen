- id: RGA-055
  priority: P1
  decision: risk-accepted
  owner: patrick
  rationale: The credential proof is checked at the approval height; the approved status is a durable state transition.
    A later revocation does not de-approve. The proof is height-bound, so it cannot be reused at a later height,
    but the approval remains. De-approval would need a new transition and a policy for the liability record.
  evidence:
  - kind: code
    ref: contracts/src/lib/KAsset.rho:33
  - kind: code
    ref: contracts/src/deploy/11_credentials.rho:258
  closed_on: '2026-11-08'
