- id: RGA-026
  priority: P1
  decision: fixed
  owner: patrick
  rationale: Claim and VP creation require a future deadline; with RGA-023 the oracle's caseReqOk receives a bound
    case and rejects deadline <= now. unit_claim refuses a past claim deadline and unit_oracle refuses a past dispute
    deadline without changing the K-Asset state.
  evidence:
