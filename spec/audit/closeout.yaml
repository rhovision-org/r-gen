    ref: contracts/src/deploy/30_oracle.rho:152
  - kind: code
    ref: contracts/src/lib/KAsset.rho:438
  closed_on: '2026-11-08'
  review: owner-authorized
  expiry: null
- id: RGA-025
  priority: P1
  decision: fixed
  owner: patrick
  rationale: Phase 2 caps a nest batch at 32 children and the parent list at 64, rejecting larger batches before
    proof consumption.
  evidence:
