- id: RGA-027
  priority: P1
  decision: fixed
  owner: patrick
  rationale: The advisory arm compares the caller argument to the stored subject. It is not signature-derived and
    no core commit may use it; the static gate forbids X!("check") as a commit authority. unit_credentials now exercises
    the true, wrong caller and wrong scope cases with an explicit caller address. The residual hazard is a future
    caller treating the advisory result as a signature; the gate and the documentation are the control.
  evidence:
  - kind: code
    ref: contracts/src/deploy/11_credentials.rho:139
  - kind: gate
    ref: tools/check_concurrency.py:30
  - kind: test
    ref: harness/unit_credentials.py
  closed_on: '2026-11-08'
  review: owner-authorized
  expiry: null
- id: RGA-028
  priority: P1
  decision: fixed
  owner: patrick
  rationale: Permissionless participation is the documented policy. Claim and comment authenticate a REV address
    but do not require an Identity record; unit_claim exercises an unregistered commenter, and validation still
    requires a credential proof. Identity enforcement remains an extension decision, not a core requirement.
  evidence:
