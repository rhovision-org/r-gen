- id: RGA-065
  priority: P1
  decision: fixed
  owner: patrick
  rationale: finalizeWith is the only minter; resumeFinalize commits a receipt only when it names a kassetRef and
    the claim is still validating. A Nil kassetRef answers "not minted" and leaves the claim, and the receipt now
    carries validationRef so the commit is complete. ClaimMint.lean proves resume_cannot_mint. unit_claim refuses
    resume on open and final claims and asserts the kassetRef is unchanged. A stranded pre-mint receipt needs a
    separate lease protocol, not a resume mint.
