- id: RGA-022
  priority: P0
  decision: fixed
  owner: patrick
  rationale: createBound requires authOwner, takes a subject capability, reads the subject cell, and derives assetRef
    from the subject's own uri; the raw free assetRef arm is gone. Empty writers are refused and unit_provenance
    asserts the stored assetRef equals the K-Asset uri. Residual is that a third party can still create an advisory
    record for a public subject; the record is bound to that subject but is not an attestation that the subject
    is a genuine K-Asset.
  evidence:
  - kind: code
    ref: contracts/src/deploy/40_provenance.rho:28
  - kind: code
    ref: contracts/src/deploy/40_provenance.rho:56
  - kind: code
    ref: contracts/src/deploy/40_provenance.rho:162
  - kind: test
    ref: harness/unit_provenance.py
  closed_on: '2026-11-08'
  review: owner-authorized
  expiry: null
- id: RGA-023
  priority: P0
  decision: fixed
  owner: patrick
  rationale: The raw open arm is removed. KAsset.openDispute and ValueProposition.openDispute mint a one-shot snapshot
    containing subjectRef, subjectUri, parties and discipline/jurisdiction and pass the private Apply. openBound
    consumes the snapshot, derives subjectRef/parties/requirement, checks the opener is a party and the adjudicator
    is credentialed, and stores the subjectUri. Residual is that a forged snapshot can create an advisory case,
    but it carries the forger's own Apply and cannot affect a real subject.
  evidence:
  - kind: code
    ref: contracts/src/deploy/30_oracle.rho:85
  - kind: code
    ref: contracts/src/deploy/30_oracle.rho:119
  - kind: code
    ref: contracts/src/lib/KAsset.rho:684
  - kind: code
    ref: contracts/src/deploy/22_value.rho:231
  - kind: test
    ref: harness/unit_oracle.py
  - kind: test
    ref: harness/unit_kasset.py
  closed_on: '2026-11-08'
  review: owner-authorized
  expiry: null
- id: RGA-024
  priority: P0
  decision: fixed
  owner: patrick
  rationale: Phase 3 records an execution receipt (pending/applied/failed, caseId, decision, outcome) and Apply.applyDecision
    is idempotent for a matching terminal status, so a retry can record success after a partial cross-contract failure.
    The devnet suite cannot inject a crash; the receipt remains the recovery evidence.
  evidence:
