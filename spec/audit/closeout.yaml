  - RGA-070
items:
- id: RGA-001
  priority: P1
  decision: fixed
  owner: patrick
  rationale: 'The theorem is per cell and per valid Run trace: no two same-cell events share an expected generation.
    It does not cover cross-cell races, proof reuse across arms, deployed guards, or scheduler/interleaving semantics.'
  evidence:
  - kind: theorem
    ref: spec/lean/RGen/RaceFreedom.lean:45
  - kind: theorem
    ref: spec/lean/RGen/Linear/Exec.lean:63
  - kind: doc
    ref: docs/src/reference/race-freedom-proof.md:8
  closed_on: '2026-11-08'
  review: owner-authorized
  expiry: null
- id: RGA-002
  priority: P0
  decision: fixed
  owner: patrick
  rationale: 'Phase 3 adds Linear/Consumption.lean: a well-formed trace consumes every declared proof cell before
    the arm commit and cannot consume a proof cell twice. This is a model-level trace discipline, not a refinement
    of the deployed private capability.'
  evidence:
  - kind: theorem
    ref: spec/lean/RGen/Linear/Lift.lean:16
  - kind: theorem
    ref: spec/lean/RGen/Linear/Lift.lean:23
  - kind: theorem
