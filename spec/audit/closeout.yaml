- id: RGA-033
  priority: P0
  decision: fixed
  owner: patrick
  rationale: nestReserve writes a receipt before any proof is taken; recordNestProof records each consumed proof
    in the receipt; nestCommit commits from the receipt without external calls; resumeNest re-drives the missing
    suffix and abortNest clears the receipt. NestCrash.lean proves the reservation discipline. unit_kasset drives
    an unsorted batch through reserve, partial take, refused retry, failed resume, abort and a successful re-nest;
    mid-deploy crash injection remains skipped.
  evidence:
  - kind: code
    ref: contracts/src/lib/KAsset.rho:416
  - kind: code
    ref: contracts/src/lib/KAsset.rho:482
  - kind: code
    ref: contracts/src/lib/KAsset.rho:521
  - kind: code
