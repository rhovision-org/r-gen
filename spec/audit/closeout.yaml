- id: RGA-054
  priority: P1
  decision: risk-accepted
  owner: patrick
  rationale: These are open clock/transition arms. execute replays only the adjudicator's stored decision through
    the case-bound Apply; expire refuses before the deadline; close refuses until executed or expired; Claim.expire
    refuses before the deadline. A third party can pay phlo to advance them, which is a crank, not a decision.
  evidence:
