schema_version: rgen.closeout/v1
baseline: '2026-11-08'
standard: 'Every P0/P1 has exactly one terminal decision: fixed, risk-accepted, or narrowed-claim.'
review:
  owner: patrick
  independence: single maintainer; external review is required for every S1 and remains outstanding
  s1:
