- id: RGA-051
  priority: P0
  decision: risk-accepted
  owner: patrick
  rationale: The manifest is an unsigned file of URI designations. Pinning is now implemented and tested, not merely
    proposed. Manifest::from_json_pinned refuses a substituted Root, and the web client refuses a fetched, cached
    or pasted manifest whose Root differs from VITE_RGEN_ROOT_URI. The default build remains trust-on-first-use
    because pinning is opt-in; a signed manifest is still the stronger fix. Risk accepted until an S1 external review
    or 2027-05-08, whichever is first.
