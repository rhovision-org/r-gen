- id: RGA-052
  priority: P1
  decision: risk-accepted
  owner: patrick
  rationale: The 00_root deployer becomes the installer and the 11_credentials deployer becomes the genesis Issuer.
    In the installer they are one key. Loss of that key freezes Root updates and new qualifications; there is no
    rotate arm. A governance extension must separate or rotate them.
