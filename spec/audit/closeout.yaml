- id: RGA-062
  priority: P1
  decision: risk-accepted
  owner: patrick
  rationale: validate checks the credential once and writes status validated; proveValidated mints from that durable
    status without re-reading the credential. The proof is height-bound, but a revoked validator can mint a fresh
    proof at a later height. This is the validation analogue of approval durability (RGA-055); devalidation would
    need a new transition.
  evidence:
