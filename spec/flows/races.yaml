  theorem: RGen.kasset_openDispute_approve_never_after
- cell: KAsset
  a: openDispute
  b: proveApproved
  class: ordered
  theorem: RGen.kasset_openDispute_proveApproved_never_after
- cell: KAsset
  a: openDispute
  b: openDispute
  class: exclusive
  theorem: RGen.kasset_openDispute_openDispute_never_after
- cell: KAsset
  a: applyDecision
  b: applyDecision
  class: exclusive
  theorem: RGen.kasset_decision_decision_never_after
- cell: KAsset
  a: nest
  b: nest
  class: exclusive
  theorem: RGen.kasset_nest_same_never_after_arm
  note: same child; distinct children serialize
- cell: Oracle
  a: decide
  b: decide
  class: exclusive
  theorem: RGen.oracle_decide_decide_never_after
