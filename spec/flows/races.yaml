# Race matrix: every proved arm pair, its class, and the Lean theorem.
# Classes: exclusive (whichever first, the second refuses), ordered (one direction is
# refused; the other is the serialized/non-retroactive order), independent (both succeed
# and write disjoint fields).
- cell: Credential
  a: prove
  b: revoke
  class: ordered
  theorem: RGen.credential_prove_revoke_never_after
  note: prove-then-revoke is admitted and the proof snapshot is non-retroactive
- cell: Credential
  a: revoke
  b: renew
  class: ordered
  theorem: RGen.credential_revoke_renew_never_after
- cell: Credential
  a: attest
  b: attest
  class: exclusive
  theorem: RGen.credential_attest_same_never_after
  note: same caller; distinct callers append independently
- cell: ValueProposition
  a: validate
  b: validate
  class: exclusive
  theorem: RGen.vp_validate_validate_never_after
- cell: ValueProposition
  a: validate
  b: withdraw
  class: exclusive
  theorem: RGen.vp_validate_withdraw_two_way
- cell: ValueProposition
  a: validate
  b: openDispute
  class: ordered
  theorem: RGen.vp_validate_openDispute_ordered
  note: dispute-first refuses validate; validate-first may be disputed
- cell: ValueProposition
  a: proveValidated
  b: openDispute
  class: ordered
  theorem: RGen.vp_proveValidated_openDispute_ordered
- cell: ValueProposition
  a: applyDecision
  b: applyDecision
  class: exclusive
  theorem: RGen.vp_decision_decision_never_after
- cell: Claim
  a: validate
  b: validate
  class: exclusive
  theorem: RGen.claim_validate_validate_never_after
- cell: Claim
  a: validate
  b: withdraw
  class: exclusive
  theorem: RGen.claim_validate_withdraw_two_way
- cell: Claim
  a: validate
  b: expire
  class: exclusive
  theorem: RGen.claim_validate_expire_two_way
- cell: Claim
  a: validate
  b: comment
  class: ordered
  theorem: RGen.claim_validate_blocks_comment
  note: validate-first blocks comment; comment-first leaves validate available
- cell: Claim
  a: comment
  b: comment
  class: ordered
  theorem: RGen.claim_comment_comment_appends
