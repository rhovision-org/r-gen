schema_version: rgen.improvements/v1
baseline: 527ed95
items:
- id: RR-01
  priority: P1
  title: Bind oracle case opening to the subject and verify parties
  files:
  - path: contracts/src/deploy/30_oracle.rho
    function: OracleFactory.open
    lines: 57-80
  - path: contracts/src/deploy/30_oracle.rho
    function: openCaseCheck
    lines: 27-53
  finding: RGA-023
  hazop:
  - HZ-ORACLE-004
  - HZ-ORACLE-005
  action: Require a subject capability or an authenticated subjectRef, and validate the party list against the subject record.
    Keep decide and execute bound to the stored adjudicator and the real private Apply. A public, unauthenticated open may
    remain only as an explicitly labelled advisory case.
  compatibility: Breaking for unauthenticated openers. Reads of old cases are unchanged.
  tests:
  - harness/unit_oracle.py
  - harness/unit_kasset.py
  status: fixed
  note: The raw open arm is gone; openBound consumes a one-shot subject snapshot and derives subjectRef, parties and the
    oracle requirement. The subject closure is the only producer in the core path.
- id: RR-02
  priority: P1
  title: Authenticate and bind provenance creation; reject empty writers
  files:
  - path: contracts/src/deploy/40_provenance.rho
    function: ProvenanceFactory.create
    lines: 23-32
  finding: RGA-022
  hazop:
  - HZ-PROV-002
  - HZ-PROV-003
  - HZ-PROV-005
  - HZ-PROV-007
  - HZ-PROV-011
  - HZ-PROV-012
  action: Require a creator capability and a non-empty writer list. If an asset registry is available, bind assetRef to it;
    otherwise document provenance as advisory and include the creator in the writer set. Reject empty writers so a record
    cannot be born unusable.
  compatibility: Breaking for anonymous creation and empty writer lists. Old records remain readable.
  tests:
  - harness/unit_provenance.py
  status: fixed
  note: createBound takes a subject capability, reads the subject cell and derives assetRef from the subject uri; the raw
    free assetRef arm is gone. Anchors require a non-empty hash and an existing parentHash; comments refuse an empty hash.
    Provenance remains advisory, and a third party can still create a record for a public subject.
- id: RR-03
  priority: P1
  title: Bind validated proofs to the chain height
  files:
  - path: contracts/src/deploy/22_value.rho
    function: ValueProposition.proveValidated
    lines: 183-215
  - path: contracts/src/lib/Proof.rho
    function: checkValidatedProof
    lines: 54-71
  finding: RGA-021
  hazop:
  - HZ-VP-005
  - HZ-VP-013
  action: Replace the caller-supplied @atHeight with nowHeight, or verify equality with nowHeight before issuing the proof.
    Keep the caller field in the payload. If a historical proof is needed, add an explicit bounded validFrom/validUntil rather
    than trusting an arbitrary height.
  compatibility: Breaking for callers that pass a future or historical height.
  tests:
  - harness/unit_value.py
  - harness/unit_kasset.py
  status: fixed
  note: Phase 2 binds atHeight to nowHeight; historical proofs would need an explicit window.
- id: RR-04
  priority: P1
  title: Make Claim and K-Asset verdict mappings total and aligned
  files:
  - path: contracts/src/deploy/20_claim.rho
    function: claimStatus
    lines: 48-53
  - path: contracts/src/deploy/20_claim.rho
    function: kassetStatus
    lines: 55-61
  - path: contracts/src/deploy/20_claim.rho
    function: finalizeValidation
    lines: 192-246
  finding: RGA-020
  hazop:
  - HZ-CLAIM-004
  - HZ-CLAIM-005
  - HZ-CLAIM-007
  action: Accept exactly valid, partial, and invalid. Map valid -> validated/validated, partial -> validated/conditional,
    invalid -> rejected/rejected, and reject every other verdict before any state write. State the claim/K-Asset status relation
    in the docs and the model.
  compatibility: Breaking for unknown verdicts, which currently produce inconsistent state.
  tests:
  - harness/unit_claim.py
  - harness/integration_core.py
  status: fixed
  note: Phase 2 aligns both mappings; pre-write rejection of unknown verdicts remains a follow-up.
- id: RR-05
  priority: P1
  title: Bound KAsset.nest count, depth, and per-child work
  files:
  - path: contracts/src/lib/KAsset.rho
    function: nestCheck
    lines: 260-277
  - path: contracts/src/lib/KAsset.rho
    function: nestProofs
    lines: 279-328
  - path: contracts/src/lib/KAsset.rho
    function: KAsset.nest
    lines: 330-368
  finding: RGA-025
  hazop:
  - HZ-DEPLOY-002
  - HZ-KASSET-016
  action: Reject childRefs lists above a documented cap and reject a child batch whose resolve/prove/take work would exceed
    the deploy's phlo budget. Record the cap and the expected cost in the arm reference. Do not change the forest order rules.
  compatibility: Breaking only for oversized batches; normal nesting is unchanged.
  tests:
  - harness/unit_kasset.py
  status: fixed
  note: Batch cap 32 and parent cap 64; per-child phlo is still linear in the batch.
- id: RR-06
  priority: P2
  title: Make Credential.check explicitly advisory or authenticate it
  files:
  - path: contracts/src/deploy/11_credentials.rho
    function: Credential.check
    lines: 139-167
  finding: RGA-027
  hazop:
  - HZ-CRED-016
  action: Prefer renaming the arm or documenting it as advisory. If it is kept callable by third parties, derive the caller
    from authSubject rather than accepting @caller, while keeping the existing static rule that no commit may use check as
    authority.
  compatibility: Additive for authenticated checks; breaking for callers that rely on a nominated caller string.
  tests:
  - harness/unit_credentials.py
  status: fixed
  note: Documented as advisory in the credential primitive page; no core commit uses it and check_concurrency forbids it as
    authority.
- id: RR-07
  priority: P1
  title: Validate deadlines and orderings at creation
  files:
  - path: contracts/src/deploy/20_claim.rho
    function: claimReqOk
    lines: 30-46
  - path: contracts/src/deploy/22_value.rho
    function: vpReqOk
    lines: 23-37
  - path: contracts/src/deploy/30_oracle.rho
    function: OracleFactory.open
    lines: 57-80
  finding: RGA-026
  hazop:
  - HZ-CLAIM-016
  - HZ-VP-016
  - HZ-ORACLE-016
  action: At creation, require deadlineHeight in the future (or an explicit zero-means-none rule), comment window not after
    the deadline, non-negative quantities, and a well-formed party list. Document the exact boundary semantics (strict greater-than
    on expiry).
  compatibility: Breaking for impossible or already-expired schedules.
  tests:
  - harness/unit_claim.py
  - harness/unit_value.py
  - harness/unit_oracle.py
  status: fixed
  note: Claim and VP future deadlines and claim comment ordering are checked; the oracle case guard rejects a past deadline.
    unit_oracle adds the past-dispute refusal and confirms the K-Asset remains approved.
- id: RR-08
  priority: P1
  title: Make oracle execution retry-safe and outcome-blind
  files:
  - path: contracts/src/deploy/30_oracle.rho
    function: OracleCase.execute
    lines: 152-197
  - path: contracts/src/lib/KAsset.rho
    function: Apply.applyDecision
    lines: 438-470
  finding: RGA-024
  hazop:
  - HZ-ORACLE-013
  - HZ-ORACLE-015
  - HZ-DEPLOY-011
  action: Keep the permissionless crank only if it cannot choose outcome, payee, or amount. Add an application receipt or
    idempotency key so a retry after a partial cross-contract failure can distinguish "already applied" from "apply failed",
    and make the case state transition consistent with that receipt.
  compatibility: Additive to the case record; breaking if a receipt field is required for old cases.
  tests:
  - harness/unit_oracle.py
  - harness/concurrency_core.py
  status: fixed
  note: Apply is idempotent and execute writes a pending/applied/failed receipt with the case id and decision.
- id: RR-09
  priority: P2
  title: Decide and document whether identity is required for participation
  files:
  - path: contracts/src/deploy/20_claim.rho
    function: Claim.comment
    lines: 120-145
  - path: contracts/src/deploy/20_claim.rho
    function: Claim.validate
    lines: 248-287
  finding: RGA-028
  hazop:
  - HZ-ID-012
  action: Either enforce identity resolution for claim and comment participation, or document permissionless participation
    as intentional and add a regression test that an unregistered REV address can comment but cannot validate without a credential.
  compatibility: Breaking only if identity enforcement is chosen.
  tests:
  - harness/unit_claim.py
  status: fixed
  note: Permissionless participation is documented as intentional; unit_claim asserts an unregistered actor can comment.
- id: RR-11
  priority: P1
  title: Make cross-cell factory, validation, and nesting steps recovery-safe
  files:
  - path: contracts/src/deploy/10_identity.rho
    function: IdentityFactory.create
    lines: 35-97
  - path: contracts/src/deploy/20_claim.rho
    function: finalizeValidation
    lines: 192-246
  - path: contracts/src/lib/KAsset.rho
    function: KAsset.nest
    lines: 330-368
  finding: RGA-031
  hazop:
  - HZ-ID-011
  - HZ-CRED-015
  - HZ-CLAIM-012
  - HZ-CLAIM-015
  - HZ-KASSET-015
  - HZ-VP-015
  action: 'Add a recovery record or idempotent completion step for each multi-cell transition: an identity claim that can
    be completed on retry, a validation receipt that prevents a second K-Asset, and a nest receipt that lets a failed parent
    write re-post or clearly mark consumed child proofs. Where atomicity cannot be recovered, document the failure window
    and add a negative test.'
  compatibility: Additive record fields; breaking only if old in-flight records must be migrated.
  tests:
  - harness/unit_identity.py
  - harness/unit_claim.py
  - harness/unit_kasset.py
  - harness/concurrency_core.py
  status: partial
  note: Claim validation (RR-16) and nest proof-consumption (RR-15) recovery are fixed. Identity create already has a
    reserving/minted/active directory record and a subject-only resume arm; unit_identity now covers active, no-pending and
    non-subject resume. The minted-pending transition still needs a fault-injection test.
- id: RR-10
  priority: P2
  title: Cap or measure registry growth and create serialization
  files:
  - path: contracts/src/deploy/00_root.rho
    function: GenRoot.register
    lines: 39-63
  - path: contracts/src/deploy/10_identity.rho
    function: IdentityFactory.create
    lines: 35-97
  - path: contracts/src/deploy/11_credentials.rho
    function: CredentialFactory.issue
    lines: 101-130
  finding: RGA-029
  hazop:
  - HZ-ROOT-002
  - HZ-ROOT-003
  - HZ-ROOT-004
  - HZ-ROOT-005
  - HZ-ROOT-007
  - HZ-REG-001
  action: Add a documented cap or sharding plan for directoryState/factoryState, and emit or document a metric for create
    serialization. No behaviour change for normal sizes; the goal is to make the throughput ceiling explicit rather than implicit.
  compatibility: No normal-size change; a cap would be breaking at the cap.
  tests:
  - harness/unit_identity.py
  - harness/unit_credentials.py
  status: accepted
  note: Directory and factory states remain explicit serialization points; a cap/sharding plan is deferred.
- id: RR-12
  priority: P0
  title: Harden capability handoff, child anchoring, and the Issuer authorize arm
  files:
  - path: contracts/src/lib/KAsset.rho
    function: checkChildKassetUri
    lines: 286-296
  - path: contracts/src/lib/KAsset.rho
    function: makeKAsset
    lines: 606-610
  - path: contracts/src/deploy/11_credentials.rho
    function: Issuer.authorize
    lines: 69-90
  - path: contracts/src/deploy/20_claim.rho
    function: finalizeWith
    lines: 259-261
  finding: RGA-049
  hazop: []
  action: 'Anchor a nested child to the genuine Claim''s kassetRef.uri, resolve the child from that URI, and require the
    proof id/uri to match; stop returning the K-Asset bundle in makeKAsset''s reply; and make Issuer.authorize derive the
    caller from a dId name with authSubject. Add RT-031/RT-032 and unit_kasset coverage.'
  compatibility: The KAsset library and the Issuer authorize signature are internal to the deployed terms; no client calls
    authorize directly. The nested childRef shape is unchanged.
  tests:
  - harness/unit_kasset.py
  - harness/unit_claim.py
  - harness/redteam_capabilities.py
  status: fixed
  note: RGA-049 is fixed - the child is anchored to the claim kassetRef, the K-Asset bundle is no longer in the reply, and
    Issuer.authorize derives the caller through authSubject. RT-031/RT-032 pass.
- id: RR-13
  priority: P0
  title: Authenticate Root.register before consuming rootState and verify installs through Root
  files:
  - path: contracts/src/deploy/00_root.rho
    function: GenRoot.register
    lines: 39-70
  - path: harness/install.py
    function: verify_components
    lines: 113-170
  finding: RGA-061
  hazop: []
  action: 'Move authSubject before the linear rootState receive and answer a failed auth with (false, "not installer");
    resolve all nine component keys through Root before writing the manifest and reject a rendered term that still contains
    a dry-run placeholder.'
  compatibility: The register arm signature is unchanged; the installer now fails instead of writing a partial manifest.
  tests:
  - harness/install.py
  - harness/unit_identity.py
  - harness/redteam_capabilities.py
  status: fixed
  note: The installer reports Root resolves 9/9 keys on the normal path. A blocked dId no longer loses the Root directory.
- id: RR-14
  priority: P0
  title: Verify the value proposition reference at claim creation
  files:
  - path: contracts/src/deploy/20_claim.rho
    function: claimVpGate
    lines: 90-111
  - path: contracts/src/deploy/20_claim.rho
    function: ClaimFactory.create
    lines: 120-160
  finding: RGA-046
  hazop: []
  action: Resolve valuePropositionRef through ValuePropositionFactory.verify before the claim state is created; refuse an
    unknown or malformed reference. Keep the validated-at-approval check in the K-Asset library.
  compatibility: Additive for a Nil reference; breaking only for a claim that references a VP the genuine factory did not
    issue.
  tests:
  - harness/unit_claim.py
  status: fixed
  note: claimVpGate resolves the reference; unit_claim refuses a self-registered URI with "value proposition".
- id: RR-15
  priority: P0
  title: Reserve and record child proofs before a nest commit
  files:
  - path: contracts/src/lib/KAsset.rho
    function: nestReserve
    lines: 482-504
  - path: contracts/src/lib/KAsset.rho
    function: recordNestProof
    lines: 416-431
  - path: contracts/src/lib/KAsset.rho
    function: nestCommit
    lines: 521-580
  - path: contracts/src/lib/KAsset.rho
    function: KAsset
    lines: 586-665
  finding: RGA-033
  hazop:
  - HZ-KASSET-015
  action: Write a nest receipt before consuming any child proof, record each consumed proof in the receipt, commit only from
    the receipt and without external calls, and expose resumeNest/abortNest so a failed batch is recoverable.
  compatibility: Additive state field and two new arms. A nest that fails after taking proofs now leaves a receipt; a retry
    must resume or abort, which is an explicit recovery rather than a burned proof.
  tests:
  - harness/unit_kasset.py
  status: fixed
  note: unit_kasset drives an unsorted batch through reserve, partial take, refused retry, failed resume, abort and a
    successful re-nest. NestCrash.lean proves the reservation discipline; mid-deploy crash injection remains skipped.
- id: RR-16
  priority: P1
  title: Resume a claim receipt without minting
  files:
  - path: contracts/src/deploy/20_claim.rho
    function: finalizeWith
    lines: 249-312
  - path: contracts/src/deploy/20_claim.rho
    function: resumeFinalize
    lines: 345-366
  finding: RGA-065
  hazop: []
  action: Keep finalizeWith as the only minter. A resume commits only a receipt that names a kassetRef and only while the
    claim is validating; a Nil kassetRef is refused as not minted. Carry validationRef in the receipt so the commit is
    complete.
  compatibility: A claim whose validation receipt never received a K-Asset is no longer resumable; that is the intended
    safety-over-liveness choice. Normal validation and completed resumes are unchanged.
  tests:
  - harness/unit_claim.py
  status: fixed
  note: unit_claim refuses resume on open and final claims and asserts the kassetRef is unchanged. ClaimMint.lean proves
    resume_cannot_mint; recovering a stranded pre-mint receipt needs a separate lease protocol.
- id: RR-17
  priority: P0
  title: Verify the oracle-factory wiring against Root before handing private Apply
  files:
  - path: contracts/src/lib/KAsset.rho
    function: makeKAsset
    lines: 14-30
  - path: contracts/src/deploy/22_value.rho
    function: ValuePropositionFactory
    lines: 49-57
  finding: RGA-070
  hazop: []
  action: Resolve component:oracle-factory from Root before a K-Asset is created, compare it with the installer-wired URI,
    and refuse on mismatch. Publish the VP factory only when the same comparison holds.
  compatibility: Additive to the K-Asset creation path and the VP deploy. A mismatched manifest now fails closed instead of
    wiring private Apply to a counterfeit factory.
  tests:
  - harness/unit_core.py
  - harness/unit_value.py
  status: fixed
  note: unit_core and unit_value create K-Assets and VPs through the Root-matched wiring. The mismatched-manifest refusal
    is a deploy-time path and needs external review; CHZ-030 is a HAZOP run row, so hazop is empty.
- id: RR-18
  priority: P1
  title: Add a terminal abandon path and an execution attempt counter
  files:
  - path: contracts/src/deploy/30_oracle.rho
    function: OracleCase
    lines: 245-333
  finding: RGA-071
  hazop: []
  action: Increment execution.attempts on every execute retry and add an adjudicator-only abandon arm for a decided case;
    close the case with execution.status abandoned.
  compatibility: Additive arm and execution fields. A decided case can now close without an applied outcome; execute after
    abandon refuses.
  tests:
  - harness/unit_oracle.py
  status: fixed
  note: unit_oracle covers non-adjudicator refusal, adjudicator abandon, the abandoned status and the post-abandon execute
    refusal. The failed-apply retry path still needs fault injection.
